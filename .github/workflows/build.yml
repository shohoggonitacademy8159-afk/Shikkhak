name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip and build
        run: |
          f=$(ls *.zip | head -1)
          unzip -q "$f" -d src
          cd "$(dirname "$(find src -name gradlew | head -1)")"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ShikkhokApp-APK
          path: src/**/app-debug.apk

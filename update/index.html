<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1E7F4F">
<meta name="app-id" content="SHIKKHOK_APP">
<title>প্রাথমিক শিক্ষক অ্যাপ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#1E7F4F;--gt:#E8F5EE;--ink:#12284A;--mute:#4A5B73;--bg:#F4F8F5;--line:#E1ECE5;--blue:#1F3A68;--red:#B42318}
*{box-sizing:border-box}
html,body{margin:0;background:#E4ECE7}
body{font-family:'Hind Siliguri','SolaimanLipi','Nikosh','Noto Sans Bengali',sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--g)}
.imgmenu{position:fixed;inset:0;background:rgba(14,26,44,.45);z-index:9999;display:flex;align-items:flex-end;justify-content:center}
.im-box{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));display:grid;gap:10px}
.im-box>b{font-size:17px}
.im-btn{display:flex;gap:14px;align-items:center;text-align:left;background:#F7FAF8;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;min-height:64px;cursor:pointer;font:inherit;color:var(--ink)}
.im-btn:active{background:var(--gt)}.im-btn .im-ic{font-size:28px;width:40px;text-align:center}.im-btn b{display:block;font-size:15.5px}.im-btn small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.okbox{display:flex;flex-direction:column;gap:2px;background:#E3F4EA;border:1px solid #9FD3B4;color:#17663F;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.55}
.p2grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.p2pg{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.p2im{position:relative;aspect-ratio:3/4;background:#EEF1F6;display:grid;place-items:center;overflow:hidden}.p2im img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .2s}
.p2no{position:absolute;left:6px;top:6px;background:#B42318;color:#fff;border-radius:10px;min-width:24px;height:24px;display:grid;place-items:center;font-size:12.5px;font-weight:700;padding:0 6px}
.p2bt{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}.p2bt button{min-height:42px;background:none;border:0;font-size:17px;color:var(--ink);cursor:pointer}.p2bt button:disabled{opacity:.3}.p2bt button+button{border-left:1px solid var(--line)}
.tcards{display:grid;gap:12px}
.tcard{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(18,40,74,.08);border:1px solid var(--line);border-top:5px solid var(--tc);padding:14px 14px 10px}
.tc-top{display:flex;gap:12px;align-items:flex-start}
.tc-ph{position:relative;flex:none}.tc-sl{position:absolute;left:-6px;top:-6px;min-width:24px;height:24px;border-radius:12px;background:var(--tc);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.tc-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tc-name{font-size:17px;line-height:1.35;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-des{font-size:14px;color:var(--ink);font-weight:500}
.tc-ph-no{display:inline-flex;gap:6px;align-items:center;font-size:14.5px;color:var(--g);font-weight:600;text-decoration:none;min-height:30px}.tc-ph-no.none{color:var(--mute);font-weight:400;font-size:13px}
.tdet{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.tdet summary{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;cursor:pointer;list-style:none;min-height:44px}
.tdet summary::-webkit-details-marker{display:none}
.tdet-btn{display:inline-flex;align-items:center;gap:6px;background:var(--gt);color:var(--g);border:1.5px solid var(--g);border-radius:10px;padding:7px 14px;font-size:14.5px;font-weight:700}
.tdet-btn::after{content:'▼';font-size:11px}.tdet[open] .tdet-btn{background:var(--g);color:#fff}.tdet[open] .tdet-btn::after{content:'▲'}
.tdet .kv{margin-top:10px;font-size:14.5px;background:#F7FAF8;border:1px solid var(--line);border-radius:12px;padding:10px 12px;row-gap:8px}
.tdet .kv dt{color:var(--mute)}.tdet .kv dd{color:var(--ink);font-weight:600}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:90px;box-shadow:0 0 40px rgba(18,40,74,.08)}
.app.inner{padding-bottom:24px}
h1,h2,h3,p{margin:0}
.hdr{background:var(--g);color:#fff;padding:18px 18px 76px;border-radius:0 0 28px 28px;display:flex;flex-direction:column;gap:16px}
.hdr.slim{padding-bottom:20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sch{display:flex;align-items:center;gap:10px;min-width:0}
.sch .ic{width:40px;height:40px;flex-shrink:0;border-radius:12px;background:#fff;color:var(--g);display:flex;align-items:center;justify-content:center}
.sch b{font-size:16px;line-height:1.3;display:block}
.sch small{font-size:12px;opacity:.92}
.iconbtn{position:relative;width:44px;height:44px;flex-shrink:0;border-radius:14px;border:0;background:rgba(255,255,255,.16);color:#fff;display:flex;align-items:center;justify-content:center}
.badge{position:absolute;top:5px;right:5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#C62828;color:#fff;font-size:11px;font-weight:700;line-height:14px;text-align:center;border:2px solid var(--g)}
.me{display:flex;align-items:center;gap:14px;background:transparent;border:0;color:#fff;text-align:left;padding:0}
.av{width:60px;height:60px;flex-shrink:0;border-radius:50%;background:var(--gt);color:var(--g);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;border:3px solid rgba(255,255,255,.55)}
.chip{display:inline-block;font-size:12px;font-weight:600;background:#fff;color:var(--g);padding:2px 10px;border-radius:999px}
.editpen{display:inline-flex;align-items:center;gap:4px;font-size:12px;opacity:.95;margin-left:6px}
.card{background:#fff;border-radius:20px;box-shadow:0 6px 20px rgba(18,40,74,.08);padding:16px;display:flex;flex-direction:column;gap:14px}
.overlap{margin:-58px 16px 0}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.stat .n{font-size:22px;font-weight:700;line-height:1.2}
.stat .n span{font-size:14px;font-weight:500;color:#3E5070}
.bar{height:6px;border-radius:3px}
.bar i{display:block;height:100%;border-radius:3px}
.pill{display:flex;align-items:center;gap:6px;font-size:13px;color:#3E5070;background:#F1F5FA;padding:4px 10px;border-radius:999px}
.ticker{display:flex;align-items:center;gap:10px;background:#FFF6E5;border-radius:12px;padding:8px 10px;overflow:hidden}
.ticker b{display:flex;align-items:center;gap:4px;flex-shrink:0;font-size:12px;color:#8A4B00}
.tkw{overflow:hidden;flex:1;min-width:0}
.tk{display:flex;gap:48px;white-space:nowrap;width:max-content;animation:tk 26s linear infinite;font-size:13px;color:#4A3200}
@keyframes tk{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.tk{animation:none}}
.sec{padding:22px 16px 0;display:flex;flex-direction:column;gap:12px}
.sech{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700}
.sech i{width:8px;height:8px;border-radius:50%}
.tile{text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 14px;display:flex;flex-direction:column;gap:12px;min-height:150px}
.tile:active,.lrow:active{transform:scale(.98)}
.tile.wide{grid-column:span 2;flex-direction:row;align-items:center;min-height:0;padding:14px;gap:14px}
.ib{width:64px;height:64px;flex-shrink:0;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#fff}
.ib svg{width:34px;height:34px}
.ib.sm{width:48px;height:48px;border-radius:14px}
.ib.sm svg{width:26px;height:26px}
.t1{font-size:15px;font-weight:700;line-height:1.4;display:block}
.t2{font-size:12px;color:var(--mute);display:block}
.grow{flex:1;min-width:0}
.lrow{text-align:left;background:#fff;border:1px solid #E2E9F3;border-radius:18px;padding:14px;display:flex;align-items:center;gap:14px;width:100%}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);padding:8px 8px 12px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;z-index:5}
.nav button{border:0;background:transparent;min-height:52px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mute);font-size:12px;font-weight:500}
.nav button span.p{width:52px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.nav button.on{color:var(--g);font-weight:700}
.nav button.on span.p{background:var(--gt)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:rgba(255,255,255,.16);padding:4px;border-radius:14px}
.seg button{border:0;min-height:44px;border-radius:11px;font-size:15px;font-weight:700;background:transparent;color:#fff}
.seg button.on{background:#fff;color:var(--g)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex-shrink:0;border:1px solid #CBD6E2;background:#fff;border-radius:999px;min-height:40px;padding:0 14px;font-size:14px;font-weight:600;color:var(--ink)}
.chips button.on{background:var(--g);border-color:var(--g);color:#fff}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini div{background:#F1F5FA;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.mini small{font-size:12px;color:var(--mute)}
.mini b{font-size:15px}
.next{display:flex;align-items:center;gap:12px;background:var(--gt);border-radius:14px;padding:12px}
.btn{min-height:44px;border-radius:12px;padding:0 14px;font-size:14px;font-weight:700;border:1px solid var(--g);background:#fff;color:var(--g);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.solid{background:var(--g);color:#fff;border-color:var(--g)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger.solid{background:var(--red);color:#fff}
.btn.ghost{border-color:transparent;padding:0 6px}
.btn.big{min-height:52px;font-size:15px;border-radius:14px}
.btn.full{width:100%}
.list{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.mem{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid #EDF2EF}
.mem:first-child{border-top:0}
.mem.tap{width:100%;background:#fff;border-left:0;border-right:0;border-bottom:0;text-align:left}
.list .mem.tap:first-child{border-top:0}
.ma{width:44px;height:44px;flex-shrink:0;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.sq{width:44px;height:44px;flex-shrink:0;border:0;border-radius:12px;background:var(--gt);color:var(--g);display:flex;align-items:center;justify-content:center;text-decoration:none}
.sq.blue{background:#E9EFF8;color:var(--blue)}
.date{width:52px;flex-shrink:0;border-radius:12px;background:#E9EFF8;color:var(--blue);display:flex;flex-direction:column;align-items:center;padding:6px 0}
.date b{font-size:18px;line-height:1.2}
.date small{font-size:11px;font-weight:600}
.st{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;display:inline-block;margin-top:4px}
.actions{position:sticky;bottom:0;padding:14px 16px 18px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:20px 0 -24px}
.empty{margin:16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px 20px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sheet-bg{position:fixed;inset:0;background:rgba(18,40,74,.45);display:none;z-index:10}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-radius:24px 24px 0 0;padding:18px 16px 24px;z-index:11;display:none;max-height:92vh;overflow:auto}
.sheet.open,.sheet-bg.open{display:block}
.grab{width:40px;height:4px;border-radius:2px;background:#CBD6E2;margin:0 auto 12px}
.note{display:flex;gap:12px;padding:12px 0;border-top:1px solid #EDF2EF}
.note:first-of-type{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;background:#C62828;margin-top:7px;flex-shrink:0}
.dot.read{background:#C9D3E0}
form.f{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:14px;font-weight:600}
.field label em{color:var(--red);font-style:normal}
.field input,.field select,.field textarea{font:inherit;font-size:15px;color:var(--ink);border:1px solid #B8C6D6;border-radius:12px;padding:10px 12px;min-height:46px;background:#fff;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--g);outline-offset:1px;border-color:var(--g)}
.field textarea{resize:vertical;line-height:1.5}
.hint{font-size:12px;color:var(--mute)}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #B8C6D6;border-radius:14px;padding:0 12px;min-height:48px}
.search input{border:0;outline:0;font:inherit;font-size:15px;flex:1;min-width:0;background:transparent;color:var(--ink)}
.subj{text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:118px}
.subj.add{border-style:dashed;border-color:#9FB3C8;align-items:center;justify-content:center;color:var(--g);font-weight:700}
.count{font-size:12px;font-weight:600;color:var(--mute)}
.plan{text-align:left;background:#fff;border:1px solid #E2E9F3;border-radius:16px;padding:14px;display:flex;gap:12px;width:100%}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.crumb{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--g);background:none;border:0;padding:0;min-height:40px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--mute)}
.kv dd{margin:0;font-weight:600}
.datebar{display:flex;align-items:center;gap:8px}
.datebox{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;background:#fff;border:1px solid #B8C6D6;border-radius:14px;padding:4px 8px}
.datebox input{border:0;font:inherit;font-size:14px;color:var(--mute);background:transparent;text-align:center;min-height:28px}
.sq:disabled{opacity:.35}
.tabs2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:#E8EEF5;padding:4px;border-radius:14px}
.tabs2 button{border:0;min-height:42px;border-radius:11px;font-size:14px;font-weight:700;background:transparent;color:var(--mute)}
.tabs2 button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(18,40,74,.12)}
.sumrow{display:flex;gap:6px;flex-wrap:wrap}
.sumrow span{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px}
.attrow{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.attbtns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.attbtns button,.sbtns button{min-height:40px;border-radius:10px;border:1px solid #CBD6E2;background:#fff;font-size:13px;font-weight:700;color:var(--mute);padding:0 4px}
.srow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid #EDF2EF}
.srow:first-child{border-top:0}
.rollb{min-width:40px;height:40px;flex-shrink:0;border-radius:10px;background:#F1F5FA;color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.sbtns{display:flex;gap:6px;flex-shrink:0}
.sbtns button{width:44px;min-height:44px;font-size:14px}
.times{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.times label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.times input{font:inherit;font-size:14px;border:1px solid #B8C6D6;border-radius:10px;padding:6px 8px;min-height:40px;color:var(--ink);background:#fff}
.pct{font-size:13px;font-weight:700;flex-shrink:0;text-align:right;min-width:52px}
.certwrap{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;overflow:hidden}
.warnbox{background:#FFF6E5;border:1px solid #F2D49B;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:13px;color:#5C3B00}
img.ma{object-fit:cover;background:#E8EEF5}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.photopick{display:flex;align-items:center;gap:14px}
.photopick .big{width:88px;height:88px;border-radius:50%;flex-shrink:0;overflow:hidden;background:#E8EEF5;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff}
.photopick .big img{width:100%;height:100%;object-fit:cover}
.photopick .acts{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.big-num{font-size:28px;font-weight:700;line-height:1.2;color:#0E5F58}
.gtab{width:100%;border-collapse:collapse;font-size:13px}
.gtab th,.gtab td{padding:8px 6px;border-top:1px solid #EDF2EF;text-align:right;white-space:nowrap}
.gtab th:first-child,.gtab td:first-child{text-align:left}
.gtab th{color:var(--mute);font-weight:600;border-top:0}
.scrollx{overflow-x:auto}
.bigfield{display:flex;flex-direction:column;gap:6px}
.bigfield label{font-size:15px;font-weight:600;color:var(--ink)}
.bigfield input{font:inherit;font-size:17px;color:var(--ink);border:1.5px solid #9AA8B8;border-radius:16px;padding:14px 16px;min-height:58px;background:#fff;width:100%}
.bigfield input:focus{outline:2px solid #12284A;outline-offset:1px;border-color:#12284A}
.bigfield .hint{padding-left:6px;font-size:13px}
.btn.dark{background:#12284A;border-color:#12284A;color:#fff;border-radius:16px;min-height:56px;font-size:17px}
.btn.outline{border:1.5px solid #12284A;color:#12284A;border-radius:16px;min-height:52px;font-size:15px}
.resbox{background:#F4F6F9;border-radius:14px;padding:22px 14px;text-align:center;font-size:16px;font-weight:600;color:var(--mute)}
.gtab th:first-child,.gtab td:first-child{position:sticky;left:0;background:#fff;z-index:1}
.gtab tfoot td{border-top:2px solid #CFE6D9;font-weight:700;background:#F3FAF6}
.gtab tfoot td:first-child{background:#F3FAF6}
.gtab .cum{color:#0E5F58;font-weight:600}
.stat2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat2 div{border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat2 b{font-size:20px;line-height:1.25}
.mkrow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid #EDF2EF}
.mkrow:first-child{border-top:0}
.mk{width:54px;min-height:42px;border:1px solid #B8C6D6;border-radius:10px;text-align:center;font:inherit;font-size:15px;color:var(--ink);background:#fff;padding:0 2px}
.mk.bad{border-color:#B42318;background:#FDE8E6}
.mktot{width:42px;text-align:right;font-weight:700;font-size:14px;flex-shrink:0}
.mkhead{display:flex;gap:8px;padding:6px 10px;font-size:11px;color:var(--mute);font-weight:600}

const ic = (k, sz=22) => S(P[k], `width="${sz}" height="${sz}"`);

/* ---------- version & updates ---------- */
const WEB_VERSION = '5.0';
const BR = window.AppBridge || null;
let UPD = {state: BR ? 'idle' : 'webapp'};
let updDismissed = false;
function appInfo(){
  if (!BR) return {apk:null, content:WEB_VERSION, configured:false};
  try { return JSON.parse(BR.getInfo()); } catch(e) { return {apk:'?', content:WEB_VERSION, configured:false}; }
}
const UPD_TEXT = {
  idle:'', webapp:'ওয়েব সংস্করণ সবসময় নিজে থেকেই সর্বশেষ থাকে।',
  checking:'আপডেট খোঁজা হচ্ছে…', uptodate:'অ্যাপ সর্বশেষ সংস্করণে আছে।',
  web:'নতুন আপডেট নামানো হয়েছে, চালু করার অপেক্ষায়।', apk:'অ্যাপের নতুন সংস্করণ এসেছে, ডাউনলোড করতে হবে।',
  error:'আপডেট খোঁজা যায়নি। ইন্টারনেট সংযোগ দেখে আবার চেষ্টা করুন।',
  noconfig:'এই APK-তে আপডেটের ঠিকানা নেই। GitHub থেকে বানানো APK ব্যবহার করুন।'
};
window.onUpdateStatus = function(raw){
  try { UPD = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch(e) { return; }
  if (UPD.manual) {
    if (UPD.state === 'uptodate') toast('অ্যাপ সর্বশেষ সংস্করণে আছে');
    if (UPD.state === 'error') toast('আপডেট খোঁজা যায়নি');
  }
  if (UPD.state === 'web' || UPD.state === 'apk') updDismissed = false;
  drawUpdBar();
  const line = document.getElementById('updLine');
  if (line) line.textContent = UPD_TEXT[UPD.state] || '';
};
function drawUpdBar(){
  const bar = document.getElementById('updbar');
  if (updDismissed || !(UPD.state === 'web' || UPD.state === 'apk')) { bar.innerHTML = ''; return; }
  const v = bn(UPD.version || '');
  const web = UPD.state === 'web';
  bar.innerHTML = `<div class="upd ${web?'web':''}">
    <span style="display:flex;padding-top:2px">${ic('refresh',22)}</span>
    <span class="grow"><b style="font-size:14px;display:block">${web?`নতুন আপডেট (সংস্করণ ${v}) প্রস্তুত`:`অ্যাপের নতুন সংস্করণ ${v} এসেছে`}</b>
    <span style="font-size:12px;opacity:.92;display:block">${esc(UPD.notes || (web?'চালু করলে নতুন সুবিধা যুক্ত হবে। আপনার তথ্য ঠিক থাকবে।':'নতুন APK ডাউনলোড করে ইনস্টল করুন।'))}</span></span>
    ${web?'<button class="btn" data-upd-apply>চালু করুন</button>':`${UPD.webSaved?'<button class="btn" data-upd-apply>চালু করুন</button>':''}<button class="btn" data-upd-apk>ডাউনলোড</button>`}

}
function checkUpdate(manual){ if (BR) try { BR.checkUpdate(!!manual); } catch(e) {} }

/* ---------- photos (kept apart from the main data; not in the text backup) ---------- */
const PHOTO_KEY = 'shikkhok_photos_v1';
let PHOTOS = {};
try { PHOTOS = JSON.parse(localStorage.getItem(PHOTO_KEY) || '{}') || {}; } catch(e) { PHOTOS = {}; }
function setPhoto(id, data){
  const prev = PHOTOS[id];
  if (data) PHOTOS[id] = data; else delete PHOTOS[id];
  try { localStorage.setItem(PHOTO_KEY, JSON.stringify(PHOTOS)); if (typeof scheduleBackup === 'function') scheduleBackup(); return true; }
  catch(e) { if (prev) PHOTOS[id] = prev; else delete PHOTOS[id]; toast('ছবি রাখার জায়গা ভরে গেছে; কিছু পুরোনো ছবি মুছে আবার চেষ্টা করুন'); return false; }
}
// Shrink any picked image to a small square JPEG (about 5 KB).
function shrinkImage(file, size){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      try {
        const c = document.createElement('canvas'); c.width = c.height = size;
        const s = Math.min(img.naturalWidth, img.naturalHeight), sx = (img.naturalWidth - s) / 2, sy = (img.naturalHeight - s) / 2;
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, size, size);
        g.drawImage(img, sx, sy, s, s, 0, 0, size, size);
        resolve(c.toDataURL('image/jpeg', 0.72));
      } catch(e) { reject(e); } finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('bad image')); };
    img.src = url;
  });
}
/* ---------- logo for certificates, letters and reports ---------- */
const LOGO_ID = '__logo';
const LOGO2_ID = '__logo2';
const logoL = () => PHOTOS[LOGO_ID] || '', logoR = () => PHOTOS[LOGO2_ID] || '';
const logoSrc = () => logoL() || logoR();
const logoOn = () => !!logoSrc() && DB.teacher.logoTop !== false;
const wmSrc = () => (DB.teacher.wmSide === 'r' ? logoR() || logoL() : logoL() || logoR());
const wmOn = () => !!wmSrc() && DB.teacher.logoWm !== false;
const logoHead = cls => logoOn() ? `<img class="lg${cls ? ' ' + cls : ''}" src="${logoSrc()}" alt="লোগো">` : '';
const logoWm = () => wmOn() ? `<img class="wm" src="${wmSrc()}" alt="" aria-hidden="true">` : '';
// Certificate letterhead: logos on both sides, government lines above the school name, school details below.
const HEAD_TOP_DEFAULT = 'গণপ্রজাতন্ত্রী বাংলাদেশ সরকার\nপ্রাথমিক ও গণশিক্ষা মন্ত্রণালয়\nপ্রাথমিক শিক্ষা অধিদপ্তর';
const headTop = () => (DB.teacher.headTop ?? HEAD_TOP_DEFAULT).split('\n').map(x => x.trim()).filter(Boolean);
function docHead(){
  const T = DB.teacher, show = DB.teacher.logoTop !== false;
  const place = [T.upazila && 'উপজেলা: ' + T.upazila, T.district && 'জেলা: ' + T.district].filter(Boolean).join(', ');
  const lines = [place && place + '।', T.estd && `বিদ্যালয় প্রতিষ্ঠার সন: ${bn(T.estd)} খ্রিঃ`, T.emis && `ইএমআইএস কোড: ${bn(T.emis)}`,
    ...(T.headExtra || '').split('\n').map(x => x.trim())].filter(Boolean);
  const side = src => `<span class="hl">${show && src ? `<img src="${src}" alt="লোগো">` : ''}</span>`;
  return `<div class="c-head"><div class="hrow">${side(logoL())}<div class="hmid">
    ${headTop().map((l, i) => `<div class="c-top${i ? '' : ' first'}">${esc(l)}</div>`).join('')}
    <div class="c-school">${esc(T.school)}</div>${lines.map(l => `<div class="c-sub">${esc(l)}</div>`).join('')}</div>${side(logoR())}</div></div>`;
}
const LOGO_CSS = `.lg{display:block;margin:0 auto 6px;height:64px;max-width:160px;object-fit:contain}
.wm{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);width:50%;max-width:400px;max-height:70%;object-fit:contain;opacity:.08;pointer-events:none;z-index:0}`;
// Keep the logo's shape and transparency; longest side 360 px.
function shrinkLogo(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      try {
        const k = Math.min(1, 360 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/png'));
      } catch(e) { reject(e); } finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('bad image')); };
    img.src = url;
  });
}
function logoCard(){
  const one = (id, label) => { const src = PHOTOS[id] || '';
    return `<div style="display:flex;gap:10px;align-items:center">
      <span style="width:56px;height:56px;border-radius:12px;border:1px dashed var(--line);display:grid;place-items:center;flex:none;background:#fff">${src ? `<img src="${src}" alt="${label}" style="max-width:48px;max-height:48px">` : `<span class="t2" style="font-size:10.5px;text-align:center">নেই</span>`}</span>
      <span class="grow"><b style="font-size:14px">${label}</b></span>
      <button type="button" class="btn" data-img-pick="logoFile_${id}" style="min-height:38px;padding:0 10px">${ic('upload',16)} ${src ? 'বদলান' : 'যোগ'}</button>
      ${src ? `<button type="button" class="btn danger ghost" style="min-height:38px;padding:0 8px" aria-label="${label} মুছুন" data-logo-del="${id}">${ic('trash',16)}</button>` : ''}
      <input type="file" id="logoFile_${id}" data-logo-file="${id}" accept="image/*" class="vh"></div>`; };
  const any = logoL() || logoR(), both = logoL() && logoR();
  return `<div class="card" style="gap:10px;padding:14px 16px">
    <b style="font-size:15px">লোগো</b><span class="t2" style="font-size:12.5px;line-height:1.5;margin-top:-6px">ফোনে রাখা লোগোর ছবি দিন — যেমন বামে সরকারি লোগো, ডানে প্রাথমিক শিক্ষার লোগো। সনদের উপরে দুই পাশে বসবে।</span>
    ${one(LOGO_ID, 'বাম পাশের লোগো')}${one(LOGO2_ID, 'ডান পাশের লোগো')}
    ${any ? `<label style="display:flex;gap:10px;align-items:center;font-size:14px"><input type="checkbox" data-logo-opt="logoTop" ${DB.teacher.logoTop !== false ? 'checked' : ''} style="width:22px;height:22px"> উপরে লোগো দেখান</label>
    <label style="display:flex;gap:10px;align-items:center;font-size:14px"><input type="checkbox" data-logo-opt="logoWm" ${DB.teacher.logoWm !== false ? 'checked' : ''} style="width:22px;height:22px"> মাঝখানে হালকা জলছাপ (ওয়াটারমার্ক)</label>
    ${both && DB.teacher.logoWm !== false ? `<div class="tabs2" role="radiogroup" aria-label="জলছাপের লোগো"><button type="button" class="${DB.teacher.wmSide !== 'r' ? 'on' : ''}" data-wm-side="l">জলছাপে বামের লোগো</button><button type="button" class="${DB.teacher.wmSide === 'r' ? 'on' : ''}" data-wm-side="r">জলছাপে ডানের লোগো</button></div>` : ''}` : ''}
  </div>`;
}
function bindLogo(){
  document.querySelectorAll('[data-logo-file]').forEach(f => f.addEventListener('change', async () => {
    const file = f.files && f.files[0]; if (!file) return;
    try { const d = await shrinkLogo(file); if (setPhoto(f.dataset.logoFile, d)) toast('লোগো যোগ হয়েছে'); render(); }

// First time: start the teacher list with the user's own profile.
function withTeachers(db){
  if (!Array.isArray(db.teachers)) db.teachers = [];
  if (!Array.isArray(db.certs)) db.certs = [];
  if (!db.gpf || typeof db.gpf !== 'object') db.gpf = {};
  if (!db.pension || typeof db.pension !== 'object') db.pension = {};
  if (!db.salary || typeof db.salary !== 'object') db.salary = {};
  if (!db.marks || typeof db.marks !== 'object') db.marks = {};
  if (!db.remarks || typeof db.remarks !== 'object') db.remarks = {};
  if (!db.attendance || typeof db.attendance !== 'object') db.attendance = {};
  db.attendance.teachers = db.attendance.teachers || {};
  db.attendance.students = db.attendance.students || {};
  // Give every teacher a serial number (ক্রমিক নং) once, in the old designation order.
  const noSerial = db.teachers.filter(t => !(parseInt(t.serial) > 0));
  if (noSerial.length) {
    const rank = t => { const i = ['প্রধান শিক্ষক','ভারপ্রাপ্ত প্রধান শিক্ষক','চলতি দায়িত্বপ্রাপ্ত প্রধান শিক্ষক','সহকারী শিক্ষক','সহকারী শিক্ষক (প্রাক-প্রাথমিক)','দপ্তরি কাম প্রহরী'].indexOf(t.designation); return i < 0 ? 99 : i; };
    let next = Math.max(0, ...db.teachers.map(t => parseInt(t.serial) || 0)) + 1;
    noSerial.sort((a,b) => rank(a) - rank(b)).forEach(t => { t.serial = next++; });
  }
  if (!db.teachersSeeded) {
    if (!db.teachers.length && db.teacher && db.teacher.name) db.teachers.push({id:uid(), serial:1, name:db.teacher.name, designation:db.teacher.designation||'সহকারী শিক্ষক', mobile:db.teacher.mobile||'', me:true});
    db.teachersSeeded = true;
  }
  return db;
}
// Earlier versions marked PE, arts & crafts and music out of 100 each; convert once to PE (50) and শিল্পকলা (50).
function migrateCo50(db){
  if (db.migrCo50) return db;
  const M = db.marks || {}, r1 = x => Math.round(x * 10) / 10, n = v => (v === '' || v == null) ? null : +v;
  Object.values(M).forEach(Y => Object.values(Y || {}).forEach(T => Object.entries(T || {}).forEach(([cls, C]) => {
    if (cls === 'pre' || !C) return;
    if (C.pe) Object.values(C.pe).forEach(m => { if (n(m.c) != null) m.c = r1(n(m.c) / 2); });
    const ids = new Set([...Object.keys(C.art || {}), ...Object.keys(C.music || {})]);
    if (ids.size) { C.arts = C.arts || {}; ids.forEach(id => { const a = n((C.art || {})[id] && C.art[id].c), b = n((C.music || {})[id] && C.music[id].c);
      const v = a != null && b != null ? (a + b) / 4 : (a != null ? a : b) / 2; if (v != null && !isNaN(v) && !C.arts[id]) C.arts[id] = {c: r1(v)}; }); }
  })));
  db.migrCo50 = true; return db;
}

async function authCall(path, body){

async function idToken(){
  if (!cloudOn()) throw new Error('NOT_SIGNED_IN');
  if (CLOUD.token && CLOUD.exp > Date.now() + 60000) return CLOUD.token;
  const r = await fetch(`https://securetoken.googleapis.com/v1/token?key=${FB.key}`, {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'grant_type=refresh_token&refresh_token=' + encodeURIComponent(CLOUD.refresh)});

const fsUrl = (doc, mask) => `${FS_BASE}/users/${CLOUD.uid}/backup/${doc}` + (mask ? '?' + mask.map(f => 'updateMask.fieldPaths=' + f).join('&') : '');

const sv = s => ({stringValue: String(s)}), iv = n => ({integerValue: String(n)});

async function putParts(prefix, text){

async function getParts(prefix, n){

async function cloudSync(force){

  if (!navigator.onLine) { UI.cloudErr = 'ইন্টারনেট নেই — সংযোগ পেলে নিজে থেকে পাঠানো হবে'; return; }
  cloudBusy = true; clearTimeout(cloudT);
  try {
    const dbText = JSON.stringify(DB), dbParts = await putParts('db', dbText);
    const sig = photoSig(); let phParts = CLOUD.phParts || 0;
    if (sig !== CLOUD.phSig || !phParts) { phParts = await putParts('ph', JSON.stringify(PHOTOS)); CLOUD.phSig = sig; CLOUD.phParts = phParts; }
    const at = Date.now();

    CLOUD.last = at; cloudSave(); UI.cloudErr = '';
    try { localStorage.removeItem('cloudDirty'); } catch(e) {}
  } catch(e) {
    UI.cloudErr = /PERMISSION_DENIED/.test(e.message) ? 'অনলাইন ডাটাবেইজ অনুমতি দিচ্ছে না (Firestore-এর Rules দেখুন)' : /NOT_FOUND/.test(e.message) ? 'অনলাইন ডাটাবেইজ পাওয়া যায়নি (Firestore তৈরি করা হয়েছে কি?)' : 'অনলাইনে পাঠানো যায়নি — পরে আবার চেষ্টা হবে';

async function cloudFetch(){
  const m = await fsGet('meta'); if (!m) return null;
  const at = +(m.at && m.at.integerValue) || 0, dbN = +(m.dbParts && m.dbParts.integerValue) || 0, phN = +(m.phParts && m.phParts.integerValue) || 0;

}

  </form>`);
  const f = document.getElementById('clForm'), err = t => { const e = document.getElementById('clErr'); e.textContent = t; e.style.display = t ? 'block' : 'none'; };
  f.addEventListener('submit', async e => {
    e.preventDefault(); err('');
    const email = f.elements.cl_email.value.trim(), pass = f.elements.cl_pass.value;
    if (!/^\S+@\S+\.\S+$/.test(email)) return err('সঠিক ইমেইল ঠিকানা লিখুন');
    if (pass.length < 6) return err('পাসওয়ার্ড অন্তত ৬ অক্ষরের হতে হবে');
    if (up && pass !== f.elements.cl_pass2.value) return err('দুই পাসওয়ার্ড মেলেনি');
    if (up && !document.getElementById('cl_ok').checked) return err('অ্যাকাউন্ট খুলতে উপরের শর্তে টিক দিন');
    const b = document.getElementById('clGo'); b.disabled = true; b.textContent = 'অপেক্ষা করুন…';
    try {
      signedIn(await authCall(up ? 'accounts:signUp' : 'accounts:signInWithPassword', {email, password: pass, returnSecureToken: true}));
      closeSheet(); render(); afterLogin();
    } catch(x) { err(authMsg(x.message)); b.disabled = false; b.textContent = up ? 'অ্যাকাউন্ট খুলুন' : 'লগইন'; }
  });
}

/* ---------- PRL & pension dates ---------- */
// Government servants go on PRL when they complete 59 years (60 for freedom fighters): PRL runs one year from the
// birthday on which that age is reached, and pension starts the day after PRL ends.
const isoOf = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dParse = iso => { const d = iso ? new Date(iso + 'T00:00:00') : null; return d && !isNaN(d) ? d : null; };
const addYears = (d, n) => { const x = new Date(d.getFullYear() + n, d.getMonth(), d.getDate()); if (x.getMonth() !== d.getMonth()) x.setDate(0); return x; };
function ymd(a, b){ // a <= b; whole years, months, days from a up to (not including) b
  if (!a || !b || b <= a) return {y:0, m:0, d:0};
  let y = b.getFullYear() - a.getFullYear(), m = b.getMonth() - a.getMonth(), d = b.getDate() - a.getDate();
  if (d < 0) { m--; d += new Date(b.getFullYear(), b.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }
  return {y, m, d};
}
const ymdTxt = o => [o.y && bn(o.y) + ' বছর', o.m && bn(o.m) + ' মাস', o.d && bn(o.d) + ' দিন'].filter(Boolean).join(' ') || '০ দিন';
function retireInfo(t){
  const dob = dParse(t && t.dob); if (!dob) return null;
  const age = t.ff ? 60 : 59, prl = addYears(dob, age), pen = addYears(dob, age + 1), prlEnd = new Date(pen - 864e5);
  const now = new Date(); now.setHours(0,0,0,0);
  const join = dParse(t.join);
  return {age, prl, prlEnd, pen, join, svc: join && join < prl ? ymd(join, prl) : null, left: ymd(now, prl), toPen: ymd(now, pen),
    status: now < prl ? 'service' : now < pen ? 'prl' : 'retired'};
}
const fmtD = d => fmtDate(isoOf(d));
function retireLine(t){
  const R = retireInfo(t); if (!R) return '';
  const tag = R.status === 'service' ? `<span class="st" style="background:#E6EFFA;color:#1F4E8C">পিআরএল ${ymdTxt(R.left)} পর</span>`
    : R.status === 'prl' ? `<span class="st" style="background:#FFF1D6;color:#7A4A00">পিআরএলে আছেন · পেনশন ${ymdTxt(R.toPen)} পর</span>` : `<span class="st" style="background:#EEF1F6;color:#3E5070">অবসরপ্রাপ্ত</span>`;
  return `<span class="t2">পিআরএল: ${esc(fmtD(R.prl))} · পেনশন: ${esc(fmtD(R.pen))}</span>${tag}`;
}
function retireBox(t){
  const R = retireInfo(t);
  if (!R) return '<p class="hint">জন্ম তারিখ দিলে পিআরএল ও পেনশনের তারিখ নিজে থেকে দেখাবে।</p>';
  return `<div class="card" style="gap:4px;padding:12px;background:#F7FAF8;box-shadow:none"><b style="font-size:14.5px">অবসরের সময়সূচি (স্বয়ংক্রিয়)</b>
    <dl class="kv">
      <dt>${bn(R.age)} বছর পূর্ণ / অবসর (শেষ কর্মদিবস)</dt><dd>${esc(fmtD(new Date(R.prl - 864e5)))}</dd>
      <dt>পিআরএল শুরু</dt><dd>${esc(fmtD(R.prl))}</dd>
      <dt>পিআরএল শেষ (১ বছর)</dt><dd>${esc(fmtD(R.prlEnd))}</dd>
      <dt>চূড়ান্ত অবসর / পেনশন শুরু</dt><dd style="color:#5B2F99">${esc(fmtD(R.pen))}</dd>
      ${R.svc ? `<dt>পিআরএল পর্যন্ত চাকরিকাল</dt><dd>${ymdTxt(R.svc)}</dd>` : '<dt>চাকরিকাল</dt><dd>যোগদানের তারিখ দিন</dd>'}
      ${R.status === 'service' ? `<dt>পিআরএল আসতে বাকি</dt><dd>${ymdTxt(R.left)}</dd>` : R.status === 'prl' ? `<dt>পেনশন আসতে বাকি</dt><dd>${ymdTxt(R.toPen)}</dd>` : '<dt>অবস্থা</dt><dd>অবসরপ্রাপ্ত</dd>'}
    </dl></div>`;
}

    // A serial already in use: move that teacher and everyone after them down by one.
    if (DB.teachers.some(x => x !== t && parseInt(x.serial) === rec.serial)) DB.teachers.forEach(x => { if (x !== t && parseInt(x.serial) >= rec.serial) x.serial = parseInt(x.serial) + 1; });
    const tid = id || uid();
    if (id) Object.assign(t, rec); else DB.teachers.push({id:tid, ...rec});
    const ph = getPhoto(); if (ph !== undefined) setPhoto(tid, ph);
    if (save()) toast(id?'শিক্ষকের তথ্য হালনাগাদ হয়েছে':'নতুন শিক্ষক যোগ হয়েছে');
    closeSheet(); render();
  });
}

function nextRoll(cls, section){
  const r = activeStudents().filter(x => x.cls===cls && (x.section||'')===(section||'')).map(x => parseInt(toEn(x.roll))||0);
  return (r.length ? Math.max(...r) : 0) + 1;
}

function alumniListHtml(yr, q){
  const all = alumniList();
  if (!all.length) return `<div class="card empty"><span class="ib" style="background:#C27C0E">${S(P.cert)}</span><h2 style="font-size:17px">এখনও কোনো পুরাতন শিক্ষার্থী নেই</h2><p class="t2" style="font-size:14px;line-height:1.6">"একজন যোগ" বা "সালভিত্তিক তালিকা" দিয়ে আগের বছরগুলোতে পাস করা শিক্ষার্থীদের যোগ করুন।</p></div>`;
  const list = all.filter(s => (yr === 'all' || s.alumni.year === yr) && (!q || toEn([s.name, s.father, s.mother, s.phone].join(' ')).toLowerCase().includes(q)))
    .sort((a,b) => b.alumni.year.localeCompare(a.alumni.year) || (parseInt(toEn(a.alumni.roll))||9999) - (parseInt(toEn(b.alumni.roll))||9999) || a.name.localeCompare(b.name,'bn'));
  if (!list.length) return `<div class="card empty"><p class="t2" style="font-size:14px">এই খোঁজে কাউকে পাওয়া যায়নি।</p></div>`;
  let last = '';
  return list.map(s => { const head = s.alumni.year !== last ? `${last ? '</div>' : ''}<h2 style="font-size:16px;margin:10px 0 6px">${bn(s.alumni.year)} সালে পাস/বিদায় — ${bn(list.filter(x => x.alumni.year === s.alumni.year).length)} জন</h2><div class="list">` : ''; last = s.alumni.year;
    return head + `<button class="mem tap" data-alumni="${s.id}">
    ${avatar(s.id, s.name, s.gender==='মেয়ে'?'#D23F74':s.gender==='ছেলে'?'#2563C9':'#7C4DCC')}
    <span class="grow"><span class="t1" style="font-weight:600">${esc(s.name)}</span><span class="t2">${s.alumni.roll ? 'রোল ' + esc(bn(s.alumni.roll)) + ' · ' : ''}${s.father ? 'পিতা: ' + esc(s.father) : CLASS_NAME[s.alumni.cls] || ''}</span>
      ${s.alumni.reason !== 'pass5' ? `<span class="st" style="background:#FFF1D6;color:#7A4A00">${ALUMNI_REASONS[s.alumni.reason] || ''} (${CLASS_NAME[s.alumni.cls] || ''})</span>` : ''}</span>
    <span style="color:var(--mute)">${ic('chev',20)}</span></button>`; }).join('') + '</div>';
}

}

      <div class="list" style="max-height:34vh;overflow:auto">${list.map(s => `<div class="mem" style="padding:6px 8px;gap:8px"><label style="display:flex;gap:8px;align-items:center;flex:1;min-width:0;cursor:pointer"><input type="checkbox" name="pr_pick" data-cls="${k}" value="${s.id}" checked style="width:20px;height:20px;flex:none"><span class="rollb">${s.roll ? esc(bn(s.roll)) : '–'}</span><span class="grow" style="min-width:0"><span class="t1" style="font-weight:600;font-size:14px">${esc(s.name)}</span>${repPill(s)}<span class="t2" data-pr-res="${s.id}"></span></span></label>

    <p class="hint" id="prErr" style="color:var(--red);display:none"></p>

    const byDest = {};
    picks().forEach(b => { const d = dest(b); if (d) (byDest[d] = byDest[d] || []).push({b, st: byId(b.value), promoted: b.checked}); });
    let noRes = 0;

  </form>`);

    e.preventDefault();
    const d = formData(e.target);
    const err = document.getElementById('stuErr');
    if (!d.s_name.trim()) { err.textContent = 'শিক্ষার্থীর নাম লিখুন।'; err.style.display='block'; document.getElementById('s_name').focus(); return; }
    const rec = {name:d.s_name.trim(), cls:d.s_cls, section:d.s_section.trim(), roll:toEn(d.s_roll.trim()), gender:d.s_gender, dob:d.s_dob, blood:d.s_blood,
      birthreg:d.s_birthreg.trim(), father:d.s_father.trim(), mother:d.s_mother.trim(), phone:d.s_phone.trim(), address:d.s_address.trim(), stipend:d.s_stipend, religion:d.s_religion, notes:d.s_notes.trim(), updated:Date.now()};
    if (rec.roll && !s.alumni && activeStudents().some(x => x.id !== id && x.cls === rec.cls && (x.section||'') === rec.section && toEn(x.roll) === rec.roll)) {
      err.textContent = `${CLASS_NAME[rec.cls]}-এ রোল ${bn(rec.roll)} আগে থেকেই আছে।`; err.style.display='block'; return;
    }
    const sid = id || uid();
    if (!id && UI.newAlumni && d.s_alyear) UI.newAlumni = d.s_alyear;
    if (id && s.alumni && d.s_alyear) Object.assign(s.alumni, {year: d.s_alyear, reason: d.s_alreason || s.alumni.reason, cls: s.alumni.reason === 'pass5' ? '5' : rec.cls, roll: rec.roll});
    if (!s.alumni && 's_nextroll' in d) { const v = toEn(d.s_nextroll || '').replace(/\D/g, ''); if (v) rec.nextRoll = v; else if (id) delete s.nextRoll; }
    if (id) Object.assign(s, rec); else if (UI.newAlumni) { const st = {id:sid, created:Date.now(), ...rec}; makeAlumni(st, 'pass5', `${UI.newAlumni}-12-31`, '', UI.newAlumni); DB.students.push(st); UI.alYear = UI.newAlumni; }
    else DB.students.push({id:sid, created:Date.now(), ...rec});
    UI.newAlumni = null;
    const ph = getPhoto(); if (ph !== undefined) setPhoto(sid, ph);
    if (save()) toast(id?'প্রোফাইল হালনাগাদ হয়েছে':'শিক্ষার্থীর প্রোফাইল সংরক্ষিত হয়েছে');
    closeSheet(); render();
  });
}

function subjectsFor(cls){
  return [...SUBJECTS[cls], ...((DB.customSubjects||{})[cls]||[]).map(s => [s.id, s.name, 'নিজের যোগ করা', true])];
}

  const chips = `<div class="chips" role="tablist" aria-label="শ্রেণি">${CLASSES.map(([k,l]) => `<button class="${k===cls?'on':''}" data-lp-class="${k}">${l}</button>`).join('')}</div>`;
  let body;

    body = `
      <div class="top"><h2 style="font-size:17px">${CLASS_NAME[cls]} — বিষয়সমূহ</h2><span class="count">${bn(subs.length)}টি বিষয়</span></div>
      <div class="row2">
        ${subs.map((s,i) => { const n = plansOf(s[0]).length; const col = SUBJ_COLORS[i % SUBJ_COLORS.length];
          return `<button class="subj" data-lp-subject="${esc(s[0])}"><span class="ib sm" style="background:${col}">${S(P.book)}</span><span><span class="t1" style="font-size:14px">${esc(s[1])}</span><span class="t2">${esc(s[2])}</span></span><span class="count">${n?bn(n)+'টি পরিকল্পনা':'কোনো পরিকল্পনা নেই'}${lpLib(cls, s[0]).length ? ` · ${bn(lpLib(cls, s[0]).length)}টি নমুনা` : ''}</span></button>`; }).join('')}
        <button class="subj add" data-lp-addsub>${ic('plus',26)}বিষয় যোগ করুন</button>
      </div>`;
  } else {
    const s = subs.find(x => x[0]===UI.lpSubject) || subs[0];
    const plans = plansOf(s[0]).sort((a,b) => (b.date||'').localeCompare(a.date||''));

const ATT_T = {p:['উপস্থিত','#17663F','#E3F4EA'], late:['দেরি','#7A4A00','#FFF1D6'], l:['ছুটি','#1F4E8C','#E6EFFA'], a:['অনুপস্থিত','#B42318','#FDE8E6']};
const ATT_S = {p:['উ','উপস্থিত','#17663F','#E3F4EA'], a:['অ','অনুপস্থিত','#B42318','#FDE8E6'], l:['ছু','ছুটি','#1F4E8C','#E6EFFA']};
const attDay = (kind, date, create) => { const k = DB.attendance[kind]; if (!k[date] && create) k[date] = {}; return k[date] || {}; };
const curDate = () => UI.attDate || (UI.attDate = todayISO());
const curMonth = () => UI.attMonth || (UI.attMonth = curDate().slice(0,7));
function nowHM(){ const d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function shiftDate(iso, n){ const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function longDate(iso){ try { return new Date(iso + 'T00:00:00').toLocaleDateString('bn-BD',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); } catch(e){ return iso; } }
function monthName(ym){ try { return new Date(ym + '-01T00:00:00').toLocaleDateString('bn-BD',{month:'long',year:'numeric'}); } catch(e){ return ym; } }
const isFriday = iso => new Date(iso + 'T00:00:00').getDay() === 5;
const pill = (txt, fg, bg) => `<span style="color:${fg};background:${bg}">${txt}</span>`;
function sortedStudents(cls){ return activeStudents().filter(x => x.cls === cls).sort((a,b) => (parseInt(toEn(a.roll))||9999) - (parseInt(toEn(b.roll))||9999) || (a.section||'').localeCompare(b.section||'') || a.name.localeCompare(b.name,'bn')); }
function classesWithStudents(){ return CLASSES.filter(([k]) => activeStudents().some(x => x.cls === k)); }

function dateBar(){

function setTeacherStatus(id, st){
  const d = curDate(), day = attDay('teachers', d, true);
  const r = day[id] || {};

  else { r.s = st; if ((st === 'p' || st === 'late') && !r.in && d === todayISO()) r.in = nowHM(); if (st === 'l' || st === 'a') { delete r.in; delete r.out; } day[id] = r; }
  save(); render();
}

function studentMonthData(){

/* reports as text, for WhatsApp etc. */
function copyText(text, okMsg){
  const done = () => toast(okMsg || 'কপি হয়েছে');
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly',''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch(_) {}
    document.body.removeChild(ta);
    if (ok) done(); else openSheet(`<h2 style="font-size:18px;margin-bottom:8px">রিপোর্ট</h2><p class="t2" style="font-size:13px;margin-bottom:8px">লেখাটি চেপে ধরে কপি করুন।</p><div class="field"><textarea rows="10" readonly>${esc(text)}</textarea></div><button class="btn big full" style="margin-top:12px" data-close>বন্ধ করুন</button>`);
  };
  try { if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback); else fallback(); } catch(_) { fallback(); }
}

/* ---------- GPF calculator ---------- */
// Profit rates for 2026-27 (Finance Division notice, Sept 2026): by balance at the start of the year.
const GPF_RATES_FY = '২০২৬-২৭';
const GPF_SLABS = [[1500000, 13], [3000000, 12], [Infinity, 11]];
const gpfRate = bal => GPF_SLABS.find(([lim]) => bal <= lim)[1];
const tk = n => '৳' + Math.round(n || 0).toLocaleString('bn-BD');
const tkp = n => Number.isInteger(Math.round((n || 0) * 100) / 100) ? tk(n) : '৳' + (Math.round(n * 100) / 100).toLocaleString('bn-BD', {minimumFractionDigits: 1, maximumFractionDigits: 2});
const num = v => { const n = parseFloat(toEn(String(v ?? '')).replace(/[^\d.]/g, '')); return isFinite(n) ? n : 0; };
// One year (or part of one): opening balance earns profit for M months; each monthly subscription earns it
// from the month it is credited to the end (monthly product method: 12+11+…+1 = 78 for a full year).
function gpfYear(open, monthly, M){
  const r1 = gpfRate(open), contrib = monthly * M, r2 = gpfRate(contrib);
  const iOpen = open * r1 * M / 1200, iC = monthly * (M * (M + 1) / 2) * r2 / 1200;
  return {r1, r2, contrib, iOpen, iC, profit: iOpen + iC, close: open + contrib + iOpen + iC};
}
function fyStartOf(d){ const y = d.getMonth() >= 6 ? d.getFullYear() : d.getFullYear() - 1; return new Date(y, 6, 1); }
const fyLabel = y => bn(`${y}-${String((y + 1) % 100).padStart(2, '0')}`);
function gpfData(){
  const g = DB.gpf;
  const me = DB.teachers.find(x => x.me);
  if (!g.dob && me && me.dob) g.dob = me.dob;
  return {open:g.open ?? '', basic:g.basic ?? '', pct:g.pct ?? 5, adv:g.adv ?? '', months:g.months ?? 12, dob:g.dob ?? '', retAge:g.retAge ?? 59, inc:g.inc ?? 5};
}
function gpfMonthly(d){ return num(d.basic) * Math.min(25, Math.max(5, num(d.pct))) / 100 + num(d.adv); }
function gpfProjection(d){
  if (!d.dob) return null;
  const dob = new Date(d.dob + 'T00:00:00'); if (isNaN(dob)) return null;
  const ret = new Date(dob.getFullYear() + (parseInt(toEn(d.retAge)) || 59), dob.getMonth(), dob.getDate());
  let fy = fyStartOf(new Date()), bal = num(d.open), basic = num(d.basic);
  const rows = [];
  for (let i = 0; i < 45; i++) {
    const M = Math.min(12, (ret.getFullYear() - fy.getFullYear()) * 12 + (ret.getMonth() - fy.getMonth()));
    if (M <= 0) break;
    if (i > 0) basic = basic * (1 + num(d.inc) / 100);
    const monthly = basic * Math.min(25, Math.max(5, num(d.pct))) / 100 + (i === 0 ? num(d.adv) : 0);
    const y = gpfYear(bal, monthly, M);
    rows.push({fy: fy.getFullYear(), M, basic, monthly, ...y, open: bal});
    bal = y.close;
    fy = new Date(fy.getFullYear() + 1, 6, 1);
  }
  return {ret, rows, final: bal};
}

/* ---------- assessment: marks & progress reports ---------- */
const TERMS = [['t1','প্রথম প্রান্তিক'],['t2','দ্বিতীয় প্রান্তিক'],['t3','চূড়ান্ত প্রান্তিক']];
const TERM_NAME = Object.fromEntries(TERMS);
const RELIGION_SUBJ = {islam:'ইসলাম', hindu:'হিন্দু', buddha:'বৌদ্ধ', christ:'খ্রিষ্ট'};
const CO_SUBJ = new Set(['pe','art','music','arts']);
// Marks for classes 1–5: physical & mental health education (50) and শিল্পকলা — arts & crafts with music — (50).
// Lesson plans keep the separate subjects; only assessment uses this list.
const CO_ASSESS = [['pe','শারীরিক ও মানসিক স্বাস্থ্য শিক্ষা','সহশিক্ষা'],['arts','শিল্পকলা','সহশিক্ষা']];
function assessSubjectsFor(cls){
  if (cls === 'pre') return subjectsFor(cls);
  return [...subjectsFor(cls).filter(([sid]) => !CO_SUBJ.has(sid)).filter(x => !x[3]), ...CO_ASSESS, ...subjectsFor(cls).filter(x => x[3])];
}
// Grade points (Bangladesh primary): A+ 5, A 4, A- 3.5, B 3, C 2, D 1, F 0.
const GP = {'A+':5, 'A':4, 'A-':3.5, 'B':3, 'C':2, 'D':1, 'F':0};
const gpaTxt = g => g == null ? '–' : bn(g.toFixed(2));
// 2026 primary assessment guideline: classes 1-2 → 50 continuous + 50 summative; 3-5 → 30 + 70;
// co-curricular subjects (and pre-primary) → 100% continuous.
function subjMax(cls, sid){
  if (cls !== 'pre' && (sid === 'pe' || sid === 'arts')) return {c:50, s:0};
  if (cls === 'pre' || CO_SUBJ.has(sid)) return {c:100, s:0};
  if (cls === '1' || cls === '2') return {c:50, s:50};
  return {c:30, s:70};
}
const ordBn = n => bn(n) + ({1:'ম',2:'য়',3:'য়',4:'র্থ',5:'ম',6:'ষ্ঠ',7:'ম',8:'ম',9:'ম',10:'ম'}[n] || 'তম');
function gradeOf(p){
  return p >= 80 ? 'A+' : p >= 70 ? 'A' : p >= 60 ? 'A-' : p >= 50 ? 'B' : p >= 40 ? 'C' : p >= 33 ? 'D' : 'F';
}
const GRADE_COL = {'A+':['#17663F','#E3F4EA'], 'A':['#17663F','#E3F4EA'], 'A-':['#0E5F58','#E2F4F2'], 'B':['#1F4E8C','#E6EFFA'], 'C':['#7A4A00','#FFF1D6'], 'D':['#7A4A00','#FFF1D6'], 'F':['#B42318','#FDE8E6']};
const gradePill = g => `<span class="gr" style="color:${GRADE_COL[g][0]};background:${GRADE_COL[g][1]}">${g}</span>`;
function studentSubjects(st){
  return assessSubjectsFor(st.cls).filter(([sid]) => !RELIGION_SUBJ[sid] || !st.religion || st.religion === sid);
}
function markBox(year, term, cls, subj, create){
  const M = DB.marks;
  if (!create) return (((M[year]||{})[term]||{})[cls]||{})[subj] || {};
  M[year] = M[year] || {}; M[year][term] = M[year][term] || {}; M[year][term][cls] = M[year][term][cls] || {};
  return M[year][term][cls][subj] = M[year][term][cls][subj] || {};
}
// One student's result for a term: per-subject rows with marks, plus totals.
function termResult(st, year, term){
  const rows = [];
  studentSubjects(st).forEach(([sid, name]) => {
    const m = markBox(year, term, st.cls, sid)[st.id];
    const mx = subjMax(st.cls, sid);
    if (!m || (m.c === '' || m.c == null) && (m.s === '' || m.s == null)) { if (!RELIGION_SUBJ[sid] || st.religion === sid) rows.push({sid, name, mx, has:false}); return; }
    const c = num(m.c), sm = num(m.s), tot = c + (mx.s ? sm : 0), full = mx.c + mx.s, pct = tot * 100 / full;
    const grade = gradeOf(pct);
    rows.push({sid, name, mx, has:true, c, s:sm, tot, full, pct, grade, gp: GP[grade]});
  });
  const done = rows.filter(r => r.has);
  const tot = done.reduce((a, r) => a + r.tot, 0), full = done.reduce((a, r) => a + r.full, 0);
  const pct = full ? tot * 100 / full : 0;
  const failed = done.filter(r => r.pct < 33);
  // GPA: average grade point of the marked subjects; a fail in any subject makes it 0.00
  const gpa = done.length ? (failed.length ? 0 : Math.round(done.reduce((a, r) => a + r.gp, 0) / done.length * 100) / 100) : null;
  return {rows, done, tot, full, pct, grade: full ? gradeOf(pct) : '', failed, gpa};
}
function classResults(cls, year, term){
  const list = sortedStudents(cls).map(st => ({st, r: termResult(st, year, term)}));
  // Rank by percentage (fair when some subjects are not yet marked), then by total marks.
  const key = x => Math.round(x.r.pct * 100) + ':' + x.r.tot;
  const ranked = list.filter(x => x.r.done.length).sort((a, b) => b.r.pct - a.r.pct || b.r.tot - a.r.tot);
  let pos = 0, last = null;
  ranked.forEach((x, i) => { const k = key(x); if (k !== last) { pos = i + 1; last = k; } x.pos = pos; });
  return {list, ranked};
}
function yearAttendance(st, year){
  let p = 0, a = 0;
  Object.keys(DB.attendance.students).forEach(d => { if (!d.startsWith(year)) return; const v = DB.attendance.students[d][st.id]; if (v === 'p') p++; else if (v === 'a') a++; });
  return {p, a, pct: (p + a) ? Math.round(p * 100 / (p + a)) : null};
}

// Grades 9–20: start and end of each scale. Each step is 5% more than the last, rounded up to the next 10 taka
// (checked against the published grade-10 and grade-13 step lists).

  const [a, b] = PS8[g]; const out = [a];
  while (out[out.length - 1] < b) { const nx = Math.ceil(out[out.length - 1] * 1.05 / 10) * 10; out.push(nx >= b ? b : nx); }

  const ps = A.ps || (DB.pension.auto ? '8' : '9');  // older saved settings were for the 8th scale
  const g = ps === '9' && !PS9_GRADES.includes(grade) ? 13 : grade;

/* ---------- pension & gratuity calculator ---------- */
// Pension rate (% of last basic) by completed years of pensionable service. 9th pay scale (2026) kept the existing rates.
// Sources disagree for 17–19 years, so the rate stays editable on screen.
const PEN_RATE = {5:21,6:24,7:27,8:30,9:33,10:36,11:39,12:43,13:47,14:51,15:54,16:57,17:63,18:65,19:69,20:72,21:75,22:79,23:83,24:87,25:90};
const penRate = y => y < 5 ? 0 : PEN_RATE[Math.min(25, y)];
const gratRate = y => y < 5 ? 0 : y < 10 ? 265 : y < 15 ? 260 : y < 20 ? 245 : 230;
function serviceYears(join, ret){
  if (!join || !ret) return null;
  const a = new Date(join + 'T00:00:00'), b = ret instanceof Date ? ret : new Date(ret + 'T00:00:00');
  if (isNaN(a) || isNaN(b) || b <= a) return null;
  let y = b.getFullYear() - a.getFullYear(); if (b.getMonth() < a.getMonth() || (b.getMonth() === a.getMonth() && b.getDate() < a.getDate())) y--;
  return y;
}
function penDefaults(){
  const P = DB.pension, me = DB.teachers.find(x => x.me) || {};
  const out = {...P};
  if (out.years == null && me.join && me.dob) {
    const dob = new Date(me.dob + 'T00:00:00'); const ret = new Date(dob.getFullYear() + 59, dob.getMonth(), dob.getDate());
    const y = serviceYears(me.join, ret); if (y != null) out.years = y;
  }
  if (out.basic == null && DB.gpf && DB.gpf.basic) out.basic = DB.gpf.basic;
  if (out.leave == null) out.leave = 18;
  return out;
}
function penCalc(P){
  const basic = num(P.basic), years = Math.round(num(P.years));
  const rate = P.rate !== '' && P.rate != null ? num(P.rate) : penRate(years);
  const gr = P.grat !== '' && P.grat != null ? num(P.grat) : gratRate(years);
  const gross = basic * rate / 100, net = gross / 2, gratuity = net * gr;
  const leave = basic * Math.min(18, Math.max(0, num(P.leave)));
  const med = num(P.med), gpf = num(P.gpf);
  return {basic, years, rate, gr, gross, net, gratuity, leave, med, gpf, monthly: net + med, festival: net * 2, lump: gratuity + leave + gpf};
}

// Pages live only in memory while the page is open (photos are large); nothing is written to storage.
const P2_SIZES = [['a4p','A4 খাড়া'],['a4l','A4 আড়াআড়ি'],['fit','ছবির মাপে']];
function p2State(){ if (!UI.p2) UI.p2 = {pages:[], size:'a4p', margin:'s', q:'n', bw:false, name:''}; return UI.p2; }
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
// Read a picked file into a JPEG data URL, longest side at most 2400 px.
async function fileToJpeg(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImg(url), k = Math.min(1, 2400 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.92);
  } finally { URL.revokeObjectURL(url); }
}
// Final page image: rotated, optionally turned into a clean black-and-white scan, sized for the chosen quality.
async function pageJpeg(pg, o){
  const img = await loadImg(pg.src), rot = ((pg.rot % 360) + 360) % 360, side = rot % 180 !== 0;
  const max = o.q === 'h' ? 2200 : 1500, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
  const c = document.createElement('canvas'); c.width = side ? h : w; c.height = side ? w : h;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  x.translate(c.width / 2, c.height / 2); x.rotate(rot * Math.PI / 180); x.drawImage(img, -w / 2, -h / 2, w, h);
  if (o.bw) {
    const d = x.getImageData(0, 0, c.width, c.height), a = d.data;
    for (let i = 0; i < a.length; i += 4) { let g = 0.299 * a[i] + 0.587 * a[i+1] + 0.114 * a[i+2]; g = Math.max(0, Math.min(255, (g - 128) * 1.6 + 150)); a[i] = a[i+1] = a[i+2] = g; }
    x.putImageData(d, 0, 0);
  }
  const url = c.toDataURL('image/jpeg', o.q === 'h' ? 0.88 : 0.75), bin = atob(url.split(',')[1]), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return {bytes, w: c.width, h: c.height};
}
// Minimal PDF writer: one JPEG image per page.
function buildPdf(imgs, o){
  const enc = new TextEncoder(), chunks = [], offs = []; let len = 0;

  const A4 = [595.28, 841.89], m = o.margin === 's' ? 20 : 0;
  put('%PDF-1.4\n%âã\n');
  const n = imgs.length, kids = imgs.map((_, i) => `${5 + 3 * i} 0 R`).join(' ');
  offs[1] = len; put('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  offs[2] = len; put(`2 0 obj\n<< /Type /Pages /Kids [${kids}] /Count ${n} >>\nendobj\n`);
  imgs.forEach((im, i) => {
    const id = 3 + 3 * i;
    let pw, ph;
    if (o.size === 'a4p') [pw, ph] = A4; else if (o.size === 'a4l') [ph, pw] = A4;
    else { pw = A4[0]; ph = +(A4[0] * im.h / im.w).toFixed(2); }
    const s = Math.min((pw - 2 * m) / im.w, (ph - 2 * m) / im.h), dw = +(im.w * s).toFixed(2), dh = +(im.h * s).toFixed(2);
    const x = +((pw - dw) / 2).toFixed(2), y = +((ph - dh) / 2).toFixed(2), content = `q ${dw} 0 0 ${dh} ${x} ${y} cm /Im0 Do Q`;
    offs[id] = len; put(`${id} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`); put(im.bytes); put('\nendstream\nendobj\n');
    offs[id + 1] = len; put(`${id + 1} 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
    offs[id + 2] = len; put(`${id + 2} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 ${id} 0 R >> >> /Contents ${id + 1} 0 R >>\nendobj\n`);
  });
  const total = 3 + 3 * n, xref = len;
  put(`xref\n0 ${total}\n0000000000 65535 f \n` + Array.from({length: total - 1}, (_, i) => String(offs[i + 1]).padStart(10, '0') + ' 00000 n \n').join(''));

const toB64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };

async function p2Make(action){
  const S = p2State(); if (!S.pages.length) return toast('আগে ছবি যোগ করুন');
  if (UI.p2busy) return; UI.p2busy = true; render();
  try {
    const imgs = [];
    for (const pg of S.pages) imgs.push(await pageJpeg(pg, S));
    const pdf = buildPdf(imgs, S), name = p2Name();
    UI.p2last = {name, size: pdf.length, n: imgs.length};
    const br = window.AppBridge;
    if (action === 'share' && br && br.shareFile) br.shareFile(name, 'application/pdf', toB64(pdf));
    else if (action === 'save' && br && br.saveFile) { window.onFileSaved = ok => toast(ok ? 'PDF সংরক্ষিত হয়েছে' : 'সংরক্ষণ বাতিল হয়েছে'); br.saveFile(name, 'application/pdf', toB64(pdf)); }
    else {
      const file = new File([pdf], name, {type:'application/pdf'});
      if (action === 'share' && navigator.canShare && navigator.canShare({files:[file]})) { try { await navigator.share({files:[file], title:name}); } catch(e) {} }
      else { const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); toast('PDF ডাউনলোড হচ্ছে'); }
    }
  } catch(e) { toast('PDF তৈরি করা যায়নি; ছবি কম দিয়ে আবার চেষ্টা করুন'); }
  finally { UI.p2busy = false; render(); }
}

/* ---------- router ---------- */
const NAV = [['home','হোম','home'],['routine','রুটিন','clock'],['reports','রিপোর্ট','report'],['profile','প্রোফাইল','user'],['settings','সেটিংস','gear']];
const TOP = NAV.map(n => n[0]);
const ROUTE_ALIAS = {'student-profile':'students'};
function render(){
  let r = (location.hash || '#home').slice(1) || 'home';
  r = ROUTE_ALIAS[r] || r;
  if (!(TOP.includes(r) || r==='committee' || r==='students' || r==='teachers' || r==='lesson-plan' || r==='teacher-att' || r==='student-att' || r==='certificates' || r==='gpf' || r==='assessment' || r==='pension' || r==='salary' || r==='leave' || r==='img2pdf' || r==='textbooks' || ALL[r])) r = 'home';
  if (r !== UI.lastRoute) { if (r === 'teacher-att' || r === 'student-att') UI.attView = 'day'; UI.lastRoute = r; }
  const inner = !TOP.includes(r);
  $app.classList.toggle('inner', inner);
  $nav.style.display = inner ? 'none' : 'grid';
  const views = {home, profile, settings, committee, students, teachers, 'lesson-plan':lessonPlan, 'teacher-att':teacherAtt, 'student-att':studentAtt, certificates, gpf, assessment, pension, salary, leave, img2pdf, textbooks};
  $app.innerHTML = (views[r] || (() => placeholder(r)))();
  $nav.innerHTML = NAV.map(n => `<button class="${n[0]===r?'on':''}" data-go="${n[0]}" aria-label="${n[1]}" ${n[0]===r?'aria-current="page"':''}><span class="p">${ic(n[2])}</span>${n[1]}</button>`).join('');
  bindView(r);
}
function bindView(r){
  UI.photoGet = null;
  if (r === 'profile') {
    UI.photoGet = bindPhotoPicker();
    document.getElementById('profileForm').addEventListener('submit', e => {
      e.preventDefault();
      const d = formData(e.target);
      if (!d.school.trim() || !d.name.trim()) return;
      Object.assign(DB.teacher, {name:d.name.trim(), designation:d.designation, school:d.school.trim(), mobile:d.mobile.trim(), upazila:d.upazila.trim(), district:d.district.trim(), emis:toEn(d.emis.trim()),
        estd:toEn(d.estd.trim()), headTop:d.headTop.split('\n').map(x => x.trim()).filter(Boolean).join('\n'), headExtra:d.headExtra.split('\n').map(x => x.trim()).filter(Boolean).join('\n')});
      const me = DB.teachers.find(x => x.me);
      const ph = UI.photoGet ? UI.photoGet() : undefined;
      if (me && ph !== undefined) setPhoto(me.id, ph);
      if (me) Object.assign(me, {name:DB.teacher.name, designation:DB.teacher.designation, mobile:DB.teacher.mobile});
      if (save()) toast('প্রোফাইল সংরক্ষিত হয়েছে');
      render();
    });
  }
  if (r === 'assessment') {
    const y = document.getElementById('asYear'), t = document.getElementById('asTerm');
    if (y) y.addEventListener('change', () => { UI.as.year = y.value; render(); });
    if (t) t.addEventListener('change', () => { UI.as.term = t.value; render(); });
    document.querySelectorAll('[data-mk]').forEach(el => el.addEventListener('input', () => onMarkInput(el)));
    const rm = document.getElementById('asRemark');
    if (rm) rm.addEventListener('input', () => {
      const A = UI.as; DB.remarks[A.year] = DB.remarks[A.year] || {}; DB.remarks[A.year][A.term] = DB.remarks[A.year][A.term] || {};
      if (rm.value.trim()) DB.remarks[A.year][A.term][A.sid] = rm.value.trim(); else delete DB.remarks[A.year][A.term][A.sid];
      save(); const st = DB.students.find(x => x.id === A.sid), pv = document.getElementById('repPreview'); if (st && pv) pv.innerHTML = reportInner(st, A.year, A.term);
    });
  }
  if (r === 'salary') {
    const g = document.getElementById('sl_grade'), st = document.getElementById('sl_step');
    g.addEventListener('change', () => { DB.salary.grade = parseInt(g.value); DB.salary.step8 = Math.min(salaryDefaults().step8, ps8Steps(DB.salary.grade).length); save(); render(); });
    document.querySelectorAll('[data-pay]').forEach(el => el.addEventListener('change', () => {
      const k = el.dataset.pay.slice(4); DB.salary.pay = {...(DB.salary.pay || {}), [k]: Math.max(0, num(toEn(el.value)))}; save(); render(); }));
    ['area','sp'].forEach(k => { const el = document.getElementById('pay_' + k); if (el) el.addEventListener('change', () => { DB.salary.pay = {...(DB.salary.pay || {}), [k]: el.value}; save(); render(); }); });
    document.querySelectorAll('[data-pay-chk]').forEach(el => el.addEventListener('change', () => { DB.salary.pay = {...(DB.salary.pay || {}), [el.dataset.payChk]: el.checked}; save(); render(); }));
    st.addEventListener('change', () => { DB.salary.grade = parseInt(g.value); DB.salary.step8 = parseInt(st.value); save(); render(); });
  }
  if (r === 'pension') {
    ['pa_grade','pa_step','pa_join','pa_dob','pa_ret','pa_leave','pa_med','pa_gpf'].forEach(id => { const el = document.getElementById(id); if (!el) return;
      el.addEventListener(el.tagName === 'SELECT' || el.type === 'date' ? 'change' : 'input', () => {
        const gradeChanged = penAutoSave();
        if (gradeChanged) return render();
        document.getElementById('paOut').innerHTML = penAutoResult();
      }); });
    const y = document.getElementById('pn_years');
    if (y) y.addEventListener('input', () => { const n = Math.round(num(toEn(y.value)));
      document.getElementById('pn_rate').placeholder = n >= 5 ? bn(penRate(n)) + ' (নিজে থেকে)' : 'নিজে থেকে';
      document.getElementById('pn_grat').placeholder = n >= 5 ? bn(gratRate(n)) + ' (নিজে থেকে)' : 'নিজে থেকে'; });
  }
  if (r === 'gpf') {
    const map = {g_open:'open', g_basic:'basic', g_pct:'pct', g_adv:'adv', g_months:'months', g_dob:'dob', g_ret:'retAge', g_inc:'inc'};
    Object.entries(map).forEach(([id, key]) => { const el = document.getElementById(id); if (!el) return;
      el.addEventListener(el.tagName === 'SELECT' || el.type === 'date' ? 'change' : 'input', () => {
        DB.gpf[key] = (key === 'dob' || key === 'pct' || key === 'months') ? el.value : toEn(el.value);
        save(); gpfRefresh();
      }); });
  }
  if (r === 'img2pdf') bindImg2pdf();
  if (r === 'leave') {
    bindLogo();
    const L = lvState(), pv = () => { const el = document.getElementById('lvPreview'); if (el) el.innerHTML = lvLetterHtml(L); };
    document.querySelectorAll('[data-lv-in]').forEach(el => el.addEventListener('input', () => { L[el.dataset.lvIn] = el.value; pv(); }));
    document.querySelectorAll('[data-lv-in][type="date"]').forEach(el => el.addEventListener('change', () => { L[el.dataset.lvIn] = el.value; if (el.dataset.lvIn === 'from' && L.to < L.from) L.to = L.from; render(); }));
    [['lv_type','type'],['lv_tid','tid'],['lv_sid','sid'],['lv_to2','to2'],['lv_year','year']].forEach(([id, k]) => { const el = document.getElementById(id); if (el) el.addEventListener('change', () => {
      L[k] = el.value; if (k === 'type') { L.reason = ''; if (LV_DAYS[L.type]) L.to = addDays(L.from, LV_DAYS[L.type] - 1); } render(); }); });
  }
  if (r === 'certificates') {
    const s = document.getElementById('certSearch');
    if (s) s.addEventListener('input', () => { UI.cert.q = s.value; document.getElementById('certList').innerHTML = certListHtml(); });
    document.querySelectorAll('[data-cert-in]').forEach(el => el.addEventListener('input', () => {
      UI.cert[el.dataset.certIn] = el.value;
      const st = certStudent(), pv = document.getElementById('certPreview');
      if (st && pv) { pv.innerHTML = certInner(UI.cert, st); certFit(); }
    }));
    certFit(); bindLogo();
  }
  if (r === 'students') {
    const ay = document.getElementById('alYear'); if (ay) ay.addEventListener('change', () => { UI.alYear = ay.value; render(); });
    const a = document.getElementById('alSearch');
    if (a) a.addEventListener('input', () => { UI.alQuery = a.value; document.getElementById('alList').innerHTML = alumniListHtml(UI.alYear || 'all', toEn(a.value).trim().toLowerCase()); });
    const s = document.getElementById('stuSearch');
    if (s) s.addEventListener('input', () => {
      UI.stuQuery = s.value;
      const q = s.value.trim().toLowerCase();
      const list = activeStudents().filter(x => (UI.stuClass==='all' || x.cls===UI.stuClass) && (!q || [x.name,x.roll,bn(x.roll||''),x.father,x.mother,x.phone].join(' ').toLowerCase().includes(q)));
      document.getElementById('stuList').innerHTML = stuListHtml(list);
    });
  }
}
function go(id){ if (location.hash.slice(1) === id) render(); else location.hash = id; }

/* ---------- toast & sheet ---------- */
let tt;
function toast(msg, ms){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), ms || 2400);
}
const $sheet = document.getElementById('sheet'), $sbg = document.getElementById('sbg');
let lastFocus = null;
function openSheet(html){
  lastFocus = document.activeElement;
  $sheet.innerHTML = '<div class="grab" aria-hidden="true"></div>' + html;
  $sheet.classList.add('open'); $sbg.classList.add('open');
  $sheet.scrollTop = 0;
  setTimeout(() => $sheet.focus({preventScroll:true}), 50);
}
function closeSheet(){ $sheet.classList.remove('open'); $sbg.classList.remove('open'); if (lastFocus && lastFocus.focus) try { lastFocus.focus({preventScroll:true}); } catch(_){} }
$sbg.addEventListener('click', closeSheet);

  ${NOTIFS.map(n => `<div class="note"><span class="dot ${n.read?'read':''}"></span><span class="grow"><span class="t1" style="font-weight:${n.read?500:700};font-size:14px">${n.t}</span><span class="t2">${n.d}</span></span></div>`).join('')}
  <button class="btn solid big full" style="margin-top:12px" data-close>বন্ধ করুন</button>`);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('button,a[data-go]');
  if (!el) return;
  const ds = el.dataset;
  if (el.id === 'bell') return notifSheet();
  if ('close' in ds) return closeSheet();
  if ('readall' in ds) { NOTIFS.forEach(n => n.read = true); closeSheet(); render(); return toast('সব নোটিফিকেশন পড়া হয়েছে'); }
  if (ds.go) { window.scrollTo(0,0); return go(ds.go); }
  if ('back' in ds) { if (history.length > 1) history.back(); else go('home'); return; }
  // committee
  if (ds.ctab) { UI.committeeTab = ds.ctab; UI.showAllMembers = false; try { localStorage.setItem('committeeTab', ds.ctab); } catch(_) {} return render(); }
  if ('memberNew' in ds) return memberSheet(null);
  if (ds.member) return memberSheet(ds.member);
  if ('toggleMembers' in ds) { UI.showAllMembers = !UI.showAllMembers; return render(); }
  if (ds.memberDel) { const id = ds.memberDel; const k = UI.committeeTab;
    return confirmSheet('সদস্য মুছবেন?', 'এই সদস্যের তথ্য কমিটি থেকে মুছে যাবে।', 'মুছুন', () => { DB.committees[k] = DB.committees[k].filter(x => x.id !== id); if (save()) toast('সদস্য মুছে ফেলা হয়েছে'); }); }
  // assessment
  if (ds.asView) { UI.as.view = ds.asView; UI.as.sid = null; return render(); }
  if (ds.asClass) { UI.as.cls = ds.asClass; return render(); }
  if (ds.asSubj) { UI.as.subj = ds.asSubj; return render(); }
  if (ds.asTerm) { UI.as.term = ds.asTerm; return render(); }
  if (ds.asReport) { UI.as.sid = ds.asReport; UI.as.view = 'report'; window.scrollTo(0,0); return render(); }
  if ('asBack' in ds) { UI.as.view = 'sheet'; UI.as.sid = null; return render(); }
  if (ds.asRemark) { const rm = document.getElementById('asRemark'); if (rm) { rm.value = REMARKS[+ds.asRemark]; rm.dispatchEvent(new Event('input')); } return; }
  if ('asPrint' in ds) { const st = DB.students.find(x => x.id === UI.as.sid); if (st) printDoc(`অগ্রগতি প্রতিবেদন - ${st.name}`, reportDoc(st, UI.as.year, UI.as.term)); return; }
  if ('asCopy' in ds) { const st = DB.students.find(x => x.id === UI.as.sid); if (st) copyText(reportText(st, UI.as.year, UI.as.term), 'রিপোর্ট কপি হয়েছে — অভিভাবককে পাঠাতে পারেন'); return; }
  if ('asPrintSheet' in ds) return printDoc(`ফলাফল শিট - ${CLASS_NAME[UI.as.cls]}`, sheetDoc(UI.as.cls, UI.as.year, UI.as.term));
  if ('asCopySheet' in ds) return copyText(sheetText(UI.as.cls, UI.as.year, UI.as.term), 'ফলাফল কপি হয়েছে');
  // gpf

    const id = el.dataset.tin || el.dataset.tout, r = attDay('teachers', curDate(), true)[id];
    if (r) { r[el.dataset.tin ? 'in' : 'out'] = el.value; if (save()) toast('সময় সংরক্ষিত হয়েছে'); }
  }
});
window.addEventListener('hashchange', () => { closeSheet(); render(); window.scrollTo(0,0); });
document.addEventListener('change', e => {
  if (e.target && e.target.id === 'bkFile') {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    f.text().then(t => window.onBackupRead(t)).catch(() => toast('ফাইলটি পড়া যায়নি'));
    e.target.value = '';
  }
});
// First run after (re)installing: bring data back from the app's own mirror, or offer the backup folder.
if (FRESH && bkOk()) {
  let m = ''; try { m = AppBridge.readMirror() || ''; } catch(e) {}
  if (m) { try { applyBackup(JSON.parse(m)); FRESH = false; setTimeout(() => toast('আগের তথ্য ফিরিয়ে আনা হয়েছে'), 400); } catch(e) {} }
}
render();
setTimeout(takeCameraResult, 800);
if (FRESH && !cloudOn()) setTimeout(bkWelcomeSheet, 600);
if (cloudOn()) setTimeout(() => cloudSync(), 5000);
else if (bkOk()) setTimeout(() => flushBackup(true), 4000);
if (BR) setTimeout(() => checkUpdate(false), 1500);
</script>
</body>
</html>

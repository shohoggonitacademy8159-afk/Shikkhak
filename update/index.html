<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1E7F4F">
<meta name="app-id" content="SHIKKHOK_APP">
<title>প্রাথমিক শিক্ষক অ্যাপ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#1E7F4F;--gt:#E8F5EE;--ink:#12284A;--mute:#4A5B73;--bg:#F4F8F5;--line:#E1ECE5;--blue:#1F3A68;--red:#B42318}
*{box-sizing:border-box}
html,body{margin:0;background:#E4ECE7}
body{font-family:'Hind Siliguri','SolaimanLipi','Nikosh','Noto Sans Bengali',sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--g)}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:90px;box-shadow:0 0 40px rgba(18,40,74,.08)}
.app.inner{padding-bottom:24px}
h1,h2,h3,p{margin:0}
.hdr{background:var(--g);color:#fff;padding:18px 18px 76px;border-radius:0 0 28px 28px;display:flex;flex-direction:column;gap:16px}
.hdr.slim{padding-bottom:20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sch{display:flex;align-items:center;gap:10px;min-width:0}
.sch .ic{width:40px;height:40px;flex-shrink:0;border-radius:12px;background:#fff;color:var(--g);display:flex;align-items:center;justify-content:center}
.sch b{font-size:16px;line-height:1.3;display:block}
.sch small{font-size:12px;opacity:.92}
.iconbtn{position:relative;width:44px;height:44px;flex-shrink:0;border-radius:14px;border:0;background:rgba(255,255,255,.16);color:#fff;display:flex;align-items:center;justify-content:center}
.badge{position:absolute;top:5px;right:5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#C62828;color:#fff;font-size:11px;font-weight:700;line-height:14px;text-align:center;border:2px solid var(--g)}
.me{display:flex;align-items:center;gap:14px;background:transparent;border:0;color:#fff;text-align:left;padding:0}
.av{width:60px;height:60px;flex-shrink:0;border-radius:50%;background:var(--gt);color:var(--g);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;border:3px solid rgba(255,255,255,.55)}
.chip{display:inline-block;font-size:12px;font-weight:600;background:#fff;color:var(--g);padding:2px 10px;border-radius:999px}
.editpen{display:inline-flex;align-items:center;gap:4px;font-size:12px;opacity:.95;margin-left:6px}
.card{background:#fff;border-radius:20px;box-shadow:0 6px 20px rgba(18,40,74,.08);padding:16px;display:flex;flex-direction:column;gap:14px}
.overlap{margin:-58px 16px 0}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.stat .n{font-size:22px;font-weight:700;line-height:1.2}
.stat .n span{font-size:14px;font-weight:500;color:#3E5070}
.bar{height:6px;border-radius:3px}
.bar i{display:block;height:100%;border-radius:3px}
.pill{display:flex;align-items:center;gap:6px;font-size:13px;color:#3E5070;background:#F1F5FA;padding:4px 10px;border-radius:999px}
.ticker{display:flex;align-items:center;gap:10px;background:#FFF6E5;border-radius:12px;padding:8px 10px;overflow:hidden}
.ticker b{display:flex;align-items:center;gap:4px;flex-shrink:0;font-size:12px;color:#8A4B00}
.tkw{overflow:hidden;flex:1;min-width:0}
.tk{display:flex;gap:48px;white-space:nowrap;width:max-content;animation:tk 26s linear infinite;font-size:13px;color:#4A3200}
@keyframes tk{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.tk{animation:none}}
.sec{padding:22px 16px 0;display:flex;flex-direction:column;gap:12px}
.sech{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700}
.sech i{width:8px;height:8px;border-radius:50%}
.tile{text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 14px;display:flex;flex-direction:column;gap:12px;min-height:150px}
.tile:active,.lrow:active{transform:scale(.98)}
.tile.wide{grid-column:span 2;flex-direction:row;align-items:center;min-height:0;padding:14px;gap:14px}
.ib{width:64px;height:64px;flex-shrink:0;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#fff}
.ib svg{width:34px;height:34px}
.ib.sm{width:48px;height:48px;border-radius:14px}
.ib.sm svg{width:26px;height:26px}
.t1{font-size:15px;font-weight:700;line-height:1.4;display:block}
.t2{font-size:12px;color:var(--mute);display:block}
.grow{flex:1;min-width:0}
.lrow{text-align:left;background:#fff;border:1px solid #E2E9F3;border-radius:18px;padding:14px;display:flex;align-items:center;gap:14px;width:100%}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);padding:8px 8px 12px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;z-index:5}
.nav button{border:0;background:transparent;min-height:52px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mute);font-size:12px;font-weight:500}
.nav button span.p{width:52px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.nav button.on{color:var(--g);font-weight:700}
.nav button.on span.p{background:var(--gt)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:rgba(255,255,255,.16);padding:4px;border-radius:14px}
.seg button{border:0;min-height:44px;border-radius:11px;font-size:15px;font-weight:700;background:transparent;color:#fff}
.seg button.on{background:#fff;color:var(--g)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex-shrink:0;border:1px solid #CBD6E2;background:#fff;border-radius:999px;min-height:40px;padding:0 14px;font-size:14px;font-weight:600;color:var(--ink)}
.chips button.on{background:var(--g);border-color:var(--g);color:#fff}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini div{background:#F1F5FA;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.mini small{font-size:12px;color:var(--mute)}
.mini b{font-size:15px}
.next{display:flex;align-items:center;gap:12px;background:var(--gt);border-radius:14px;padding:12px}
.btn{min-height:44px;border-radius:12px;padding:0 14px;font-size:14px;font-weight:700;border:1px solid var(--g);background:#fff;color:var(--g);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.solid{background:var(--g);color:#fff;border-color:var(--g)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger.solid{background:var(--red);color:#fff}
.btn.ghost{border-color:transparent;padding:0 6px}
.btn.big{min-height:52px;font-size:15px;border-radius:14px}
.btn.full{width:100%}
.list{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.mem{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid #EDF2EF}
.mem:first-child{border-top:0}
.mem.tap{width:100%;background:#fff;border-left:0;border-right:0;border-bottom:0;text-align:left}
.list .mem.tap:first-child{border-top:0}
.ma{width:44px;height:44px;flex-shrink:0;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.sq{width:44px;height:44px;flex-shrink:0;border:0;border-radius:12px;background:var(--gt);color:var(--g);display:flex;align-items:center;justify-content:center;text-decoration:none}
.sq.blue{background:#E9EFF8;color:var(--blue)}
.date{width:52px;flex-shrink:0;border-radius:12px;background:#E9EFF8;color:var(--blue);display:flex;flex-direction:column;align-items:center;padding:6px 0}
.date b{font-size:18px;line-height:1.2}
.date small{font-size:11px;font-weight:600}
.st{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;display:inline-block;margin-top:4px}
.actions{position:sticky;bottom:0;padding:14px 16px 18px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:20px 0 -24px}
.empty{margin:16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px 20px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sheet-bg{position:fixed;inset:0;background:rgba(18,40,74,.45);display:none;z-index:10}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-radius:24px 24px 0 0;padding:18px 16px 24px;z-index:11;display:none;max-height:92vh;overflow:auto}
.sheet.open,.sheet-bg.open{display:block}
.grab{width:40px;height:4px;border-radius:2px;background:#CBD6E2;margin:0 auto 12px}
.note{display:flex;gap:12px;padding:12px 0;border-top:1px solid #EDF2EF}
.note:first-of-type{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;background:#C62828;margin-top:7px;flex-shrink:0}
.dot.read{background:#C9D3E0}
form.f{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:14px;font-weight:600}
.field label em{color:var(--red);font-style:normal}
.field input,.field select,.field textarea{font:inherit;font-size:15px;color:var(--ink);border:1px solid #B8C6D6;border-radius:12px;padding:10px 12px;min-height:46px;background:#fff;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--g);outline-offset:1px;border-color:var(--g)}
.field textarea{resize:vertical;line-height:1.5}
.hint{font-size:12px;color:var(--mute)}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #B8C6D6;border-radius:14px;padding:0 12px;min-height:48px}
.search input{border:0;outline:0;font:inherit;font-size:15px;flex:1;min-width:0;background:transparent;color:var(--ink)}
.subj{text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:118px}
.subj.add{border-style:dashed;border-color:#9FB3C8;align-items:center;justify-content:center;color:var(--g);font-weight:700}
.count{font-size:12px;font-weight:600;color:var(--mute)}
.plan{text-align:left;background:#fff;border:1px solid #E2E9F3;border-radius:16px;padding:14px;display:flex;gap:12px;width:100%}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.crumb{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--g);background:none;border:0;padding:0;min-height:40px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--mute)}
.kv dd{margin:0;font-weight:600}
.datebar{display:flex;align-items:center;gap:8px}
.datebox{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;background:#fff;border:1px solid #B8C6D6;border-radius:14px;padding:4px 8px}
.datebox input{border:0;font:inherit;font-size:14px;color:var(--mute);background:transparent;text-align:center;min-height:28px}
.sq:disabled{opacity:.35}
.tabs2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:#E8EEF5;padding:4px;border-radius:14px}
.tabs2 button{border:0;min-height:42px;border-radius:11px;font-size:14px;font-weight:700;background:transparent;color:var(--mute)}
.tabs2 button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(18,40,74,.12)}
.sumrow{display:flex;gap:6px;flex-wrap:wrap}
.sumrow span{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px}
.attrow{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.attbtns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.attbtns button,.sbtns button{min-height:40px;border-radius:10px;border:1px solid #CBD6E2;background:#fff;font-size:13px;font-weight:700;color:var(--mute);padding:0 4px}
.srow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid #EDF2EF}
.srow:first-child{border-top:0}
.rollb{min-width:40px;height:40px;flex-shrink:0;border-radius:10px;background:#F1F5FA;color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.sbtns{display:flex;gap:6px;flex-shrink:0}
.sbtns button{width:44px;min-height:44px;font-size:14px}
.times{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.times label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.times input{font:inherit;font-size:14px;border:1px solid #B8C6D6;border-radius:10px;padding:6px 8px;min-height:40px;color:var(--ink);background:#fff}
.pct{font-size:13px;font-weight:700;flex-shrink:0;text-align:right;min-width:52px}
#updbar{max-width:480px;margin:0 auto;position:sticky;top:0;z-index:6}
#updbar:empty{display:none}
.upd{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;color:#fff;background:#12284A}
.upd.web{background:#17663F}
.upd .btn{border-color:#fff;color:#12284A;background:#fff;min-height:40px;font-size:13px;flex-shrink:0}
.upd .x{background:transparent;border:0;color:#fff;width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:10px}
.updline{font-size:13px;color:var(--mute);min-height:20px}
</style>
</head>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

function withTeachers(db){
  if (!Array.isArray(db.teachers)) db.teachers = [];
  if (!db.attendance || typeof db.attendance !== 'object') db.attendance = {};
  db.attendance.teachers = db.attendance.teachers || {};
  db.attendance.students = db.attendance.students || {};
  if (!db.teachersSeeded) {
    if (!db.teachers.length && db.teacher && db.teacher.name) db.teachers.push({id:uid(), name:db.teacher.name, designation:db.teacher.designation||'সহকারী শিক্ষক', mobile:db.teacher.mobile||'', me:true});
    db.teachersSeeded = true;
  }
  return db;
}

    </div>

    </div>
    ${field('b_names','শিক্ষার্থীদের নাম', ta('b_names','',9,'placeholder="আয়েশা সিদ্দিকা&#10;মোঃ রাকিব হাসান&#10;সুমাইয়া আক্তার"'), true)}

    <p class="hint" id="bulkErr" style="color:var(--red);display:none"></p>
    <div class="row2"><button type="button" class="btn big" data-close>বাতিল</button><button type="submit" class="btn big solid">সব যোগ করুন</button></div>
  </form>`);
  const f = document.getElementById('bulkForm');
  const names = () => f.elements.b_names.value.split(/\n/).map(x => x.replace(/^\s*[\d০-৯]+[.)।:-]?\s*/, '').trim()).filter(Boolean);
  const upd = () => { document.getElementById('bulkCount').textContent = bn(names().length) + ' জন'; };
  const reroll = () => { f.elements.b_roll.value = String(nextRoll(f.elements.b_cls.value, f.elements.b_section.value.trim())); };
  f.elements.b_names.addEventListener('input', upd);
  f.elements.b_cls.addEventListener('change', reroll);
  f.elements.b_section.addEventListener('change', reroll);

    e.preventDefault();

    const list = names(), clsV = f.elements.b_cls.value, sec = f.elements.b_section.value.trim();
    const start = parseInt(toEn(f.elements.b_roll.value)) || 1;

    const taken = new Set(DB.students.filter(x => x.cls===clsV && (x.section||'')===sec).map(x => toEn(x.roll)));

    const now = Date.now();
    list.forEach((name, i) => DB.students.push({id:uid(), created:now, updated:now, name, cls:clsV, section:sec, roll:String(start + i), gender:f.elements.b_gender.value}));

    UI.stuClass = clsV; closeSheet(); render();
  });
}

function subjectsFor(cls){

}

  let body;
  if (!UI.lpSubject) {
    body = `
      <div class="top"><h2 style="font-size:17px">${CLASS_NAME[cls]} — বিষয়সমূহ</h2><span class="count">${bn(subs.length)}টি বিষয়</span></div>
      <div class="row2">
        ${subs.map((s,i) => { const n = plansOf(s[0]).length; const col = SUBJ_COLORS[i % SUBJ_COLORS.length];

      </div>`;

/* ---------- attendance ---------- */
const ATT_T = {p:['উপস্থিত','#17663F','#E3F4EA'], late:['দেরি','#7A4A00','#FFF1D6'], l:['ছুটি','#1F4E8C','#E6EFFA'], a:['অনুপস্থিত','#B42318','#FDE8E6']};
const ATT_S = {p:['উ','উপস্থিত','#17663F','#E3F4EA'], a:['অ','অনুপস্থিত','#B42318','#FDE8E6'], l:['ছু','ছুটি','#1F4E8C','#E6EFFA']};
const attDay = (kind, date, create) => { const k = DB.attendance[kind]; if (!k[date] && create) k[date] = {}; return k[date] || {}; };
const curDate = () => UI.attDate || (UI.attDate = todayISO());
const curMonth = () => UI.attMonth || (UI.attMonth = curDate().slice(0,7));
function nowHM(){ const d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function shiftDate(iso, n){ const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function longDate(iso){ try { return new Date(iso + 'T00:00:00').toLocaleDateString('bn-BD',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); } catch(e){ return iso; } }
function monthName(ym){ try { return new Date(ym + '-01T00:00:00').toLocaleDateString('bn-BD',{month:'long',year:'numeric'}); } catch(e){ return ym; } }
const isFriday = iso => new Date(iso + 'T00:00:00').getDay() === 5;
const pill = (txt, fg, bg) => `<span style="color:${fg};background:${bg}">${txt}</span>`;
function sortedStudents(cls){ return DB.students.filter(x => x.cls === cls).sort((a,b) => (a.section||'').localeCompare(b.section||'') || (parseInt(toEn(a.roll))||999) - (parseInt(toEn(b.roll))||999)); }
function classesWithStudents(){ return CLASSES.filter(([k]) => DB.students.some(x => x.cls === k)); }

function dateBar(){
  const d = curDate(), t = todayISO();
  return `<div class="datebar">
    <button class="sq blue" data-att-shift="-1" aria-label="আগের দিন">${ic('back',20)}</button>
    <label class="datebox"><span class="t1" style="font-size:14px;text-align:center">${d === t ? 'আজ, ' : ''}${longDate(d)}</span><input type="date" id="attDate" value="${d}" max="${t}" aria-label="তারিখ বাছাই"></label>
    <button class="sq blue" data-att-shift="1" ${d >= t ? 'disabled' : ''} aria-label="পরের দিন">${ic('chev',20)}</button>
  </div>${isFriday(d) ? '<p class="hint" style="text-align:center">শুক্রবার — সাপ্তাহিক ছুটির দিন</p>' : ''}`;
}
function attTabs(){
  return `<div class="tabs2" role="tablist"><button role="tab" class="${UI.attView==='day'?'on':''}" data-att-view="day">দৈনিক হাজিরা</button><button role="tab" class="${UI.attView==='month'?'on':''}" data-att-view="month">মাসিক প্রতিবেদন</button></div>`;
}
function monthBar(){
  return `<div class="field"><label for="attMonth">মাস</label><input type="month" id="attMonth" value="${curMonth()}" max="${todayISO().slice(0,7)}"></div>`;
}

/* teachers */
function teacherAtt(){
  const head = innerHeader('শিক্ষক উপস্থিতি','teacher','#1E8A55');
  if (!DB.teachers.length) return head + `<div class="card empty"><span class="ib" style="background:#0E7490">${S(P.users)}</span><p class="t2" style="font-size:14px;line-height:1.6">হাজিরা নিতে আগে শিক্ষক তালিকায় শিক্ষকদের নাম যোগ করুন।</p><button class="btn solid" data-go="teachers">শিক্ষক তালিকা খুলুন</button></div>`;
  return head + `<div class="sec" style="padding-top:16px">${attTabs()}${UI.attView === 'day' ? teacherDay() : teacherMonth()}</div>`;
}
function teacherDay(){
  const d = curDate(), day = attDay('teachers', d);
  const list = [...DB.teachers].sort((a,b) => { const r = t => { const i = T_DESIG.indexOf(t.designation); return i < 0 ? 99 : i; }; return r(a) - r(b); });
  const cnt = k => list.filter(t => (day[t.id]||{}).s === k).length;
  const marked = list.filter(t => day[t.id] && day[t.id].s).length;
  return dateBar() + `
    <div class="sumrow">${Object.entries(ATT_T).map(([k,v]) => pill(`${v[0]} ${bn(cnt(k))}`, v[1], v[2])).join('')}${pill(`বাকি ${bn(list.length - marked)}`, '#3E5070', '#EEF1F6')}</div>
    ${marked < list.length ? `<button class="btn big full" data-tatt-all>${ic('teacher',20)} বাকি সবাইকে উপস্থিত করুন</button>` : ''}
    ${list.map(t => { const r = day[t.id] || {}; const present = r.s === 'p' || r.s === 'late';
      return `<div class="attrow">
        <div style="display:flex;align-items:center;gap:10px"><span class="ma" style="background:${r.s ? ATT_T[r.s][1] : '#9AA8B8'};width:40px;height:40px;font-size:14px" aria-hidden="true">${esc(initials(t.name))}</span>
          <span class="grow"><span class="t1" style="font-weight:600">${esc(t.name)}</span><span class="t2">${esc(t.designation)}${r.s ? ' · ' + ATT_T[r.s][0] : ''}</span></span></div>
        <div class="attbtns" role="group" aria-label="${esc(t.name)}-এর হাজিরা">${Object.entries(ATT_T).map(([k,v]) => `<button data-tatt="${t.id}" data-st="${k}" aria-pressed="${r.s===k}" style="${r.s===k?`background:${v[2]};color:${v[1]};border-color:${v[1]}`:''}">${v[0]}</button>`).join('')}</div>
        ${present ? `<div class="times"><label>আগমন<input type="time" data-tin="${t.id}" value="${esc(r.in||'')}"></label><label>প্রস্থান<input type="time" data-tout="${t.id}" value="${esc(r.out||'')}"></label></div>` : ''}
      </div>`; }).join('')}
    <p class="hint" style="text-align:center">প্রতিটি পরিবর্তন সাথে সাথে সংরক্ষিত হয়।</p>`;
}
function teacherMonth(){
  const ym = curMonth();
  const days = Object.keys(DB.attendance.teachers).filter(d => d.startsWith(ym) && Object.keys(DB.attendance.teachers[d]).length).sort();
  const rows = DB.teachers.map(t => { const c = {p:0,late:0,l:0,a:0}; days.forEach(d => { const r = DB.attendance.teachers[d][t.id]; if (r && c[r.s] !== undefined) c[r.s]++; }); return {t, c}; });
  return monthBar() + `
    <div class="card" style="gap:10px"><h2 style="font-size:16px">${monthName(ym)}</h2><span class="t2" style="font-size:13px">হাজিরা নেওয়া হয়েছে ${bn(days.length)} দিন</span></div>
    ${days.length ? `<div class="list">${rows.map(({t,c}) => `<div class="mem"><span class="grow"><span class="t1" style="font-weight:600">${esc(t.name)}</span><span class="sumrow" style="margin-top:4px">${pill('উপ '+bn(c.p),'#17663F','#E3F4EA')}${pill('দেরি '+bn(c.late),'#7A4A00','#FFF1D6')}${pill('ছুটি '+bn(c.l),'#1F4E8C','#E6EFFA')}${pill('অনু '+bn(c.a),'#B42318','#FDE8E6')}</span></span></div>`).join('')}</div>
      <button class="btn big full" data-copy-tmonth>${ic('copy',20)} প্রতিবেদন কপি করুন</button>`
    : '<div class="card empty"><p class="t2" style="font-size:14px">এই মাসে কোনো হাজিরা নেওয়া হয়নি।</p></div>'}`;
}
function setTeacherStatus(id, st){
  const d = curDate(), day = attDay('teachers', d, true);
  const r = day[id] || {};
  if (r.s === st) { delete day[id]; }
  else { r.s = st; if ((st === 'p' || st === 'late') && !r.in && d === todayISO()) r.in = nowHM(); if (st === 'l' || st === 'a') { delete r.in; delete r.out; } day[id] = r; }
  save(); render();
}

/* students */
function studentAtt(){
  const head = innerHeader('শিক্ষার্থী উপস্থিতি','students','#2563C9');
  const cl = classesWithStudents();
  if (!cl.length) return head + `<div class="card empty"><span class="ib" style="background:#D23F74">${S(P.profile)}</span><p class="t2" style="font-size:14px;line-height:1.6">হাজিরা নিতে আগে শিক্ষার্থী তালিকায় নাম যোগ করুন।</p><button class="btn solid" data-go="students">শিক্ষার্থী তালিকা খুলুন</button></div>`;
  if (!UI.attClass || !cl.some(([k]) => k === UI.attClass)) UI.attClass = cl[0][0];
  const chips = `<div class="chips" role="tablist" aria-label="শ্রেণি">${cl.map(([k,l]) => `<button class="${k===UI.attClass?'on':''}" data-att-class="${k}">${l}</button>`).join('')}</div>`;
  return head + `<div class="sec" style="padding-top:16px">${attTabs()}${chips}${UI.attView === 'day' ? studentDay() : studentMonth()}</div>`;
}
function studentDay(){
  const d = curDate(), day = attDay('students', d), list = sortedStudents(UI.attClass);
  const c = {p:0,a:0,l:0}; list.forEach(s => { const v = day[s.id]; if (c[v] !== undefined) c[v]++; });
  const left = list.length - c.p - c.a - c.l;
  const rate = (c.p + c.a) ? Math.round(c.p * 100 / (c.p + c.a)) : 0;
  const hasSec = list.some(s => s.section);
  return dateBar() + `
    <div class="card" style="gap:10px">
      <div class="top"><b style="font-size:15px">${CLASS_NAME[UI.attClass]} · মোট ${bn(list.length)} জন</b>${(c.p+c.a) ? `<b style="font-size:15px;color:${rate < 75 ? '#B42318' : '#17663F'}">উপস্থিতি ${bn(rate)}%</b>` : ''}</div>
      <div class="sumrow">${pill('উপস্থিত '+bn(c.p),'#17663F','#E3F4EA')}${pill('অনুপস্থিত '+bn(c.a),'#B42318','#FDE8E6')}${pill('ছুটি '+bn(c.l),'#1F4E8C','#E6EFFA')}${pill('বাকি '+bn(left),'#3E5070','#EEF1F6')}</div>
      <div class="row2">
        <button class="btn" data-satt-all ${left ? '' : 'disabled'}>বাকি সবাই উপস্থিত</button>
        <button class="btn" data-copy-sday>${ic('copy',18)} রিপোর্ট কপি</button>
      </div>
    </div>
    <div class="list">${list.map(s => { const v = day[s.id];
      return `<div class="srow"><span class="rollb" aria-label="রোল">${s.roll ? esc(bn(s.roll)) : '–'}</span>
        <span class="grow"><span class="t1" style="font-weight:600;font-size:14px">${esc(s.name)}</span>${hasSec && s.section ? `<span class="t2">শাখা ${esc(s.section)}</span>` : ''}</span>
        <span class="sbtns" role="group" aria-label="${esc(s.name)}-এর হাজিরা">${Object.entries(ATT_S).map(([k,x]) => `<button data-satt="${s.id}" data-st="${k}" aria-label="${x[1]}" aria-pressed="${v===k}" style="${v===k?`background:${x[3]};color:${x[2]};border-color:${x[2]}`:''}">${x[0]}</button>`).join('')}</span></div>`; }).join('')}</div>
    <p class="hint" style="text-align:center">উ = উপস্থিত · অ = অনুপস্থিত · ছু = ছুটি। আবার চাপলে বাতিল হয়। প্রতিটি পরিবর্তন সাথে সাথে সংরক্ষিত হয়।</p>`;
}
function studentMonthData(){
  const ym = curMonth(), list = sortedStudents(UI.attClass), ids = new Set(list.map(s => s.id));
  const days = Object.keys(DB.attendance.students).filter(d => d.startsWith(ym) && Object.entries(DB.attendance.students[d]).some(([id]) => ids.has(id))).sort();
  const rows = list.map(s => { const c = {p:0,a:0,l:0}; days.forEach(d => { const v = DB.attendance.students[d][s.id]; if (c[v] !== undefined) c[v]++; }); const tot = c.p + c.a; return {s, c, pct: tot ? Math.round(c.p*100/tot) : null}; });
  return {ym, days, rows};
}
function studentMonth(){
  const {ym, days, rows} = studentMonthData();
  return monthBar() + `
    <div class="card" style="gap:6px"><h2 style="font-size:16px">${CLASS_NAME[UI.attClass]} · ${monthName(ym)}</h2><span class="t2" style="font-size:13px">হাজিরা নেওয়া হয়েছে ${bn(days.length)} দিন। উপস্থিতির হার ছুটির দিন বাদে হিসাব করা; ৭৫%-এর কম লাল রঙে।</span></div>
    ${days.length ? `<div class="list">${rows.map(({s,c,pct}) => `<div class="srow"><span class="rollb">${s.roll ? esc(bn(s.roll)) : '–'}</span><span class="grow"><span class="t1" style="font-weight:600;font-size:14px">${esc(s.name)}</span><span class="t2">উপ ${bn(c.p)} · অনু ${bn(c.a)} · ছুটি ${bn(c.l)}</span></span><span class="pct" style="color:${pct === null ? '#4A5B73' : pct < 75 ? '#B42318' : '#17663F'}">${pct === null ? '–' : bn(pct) + '%'}</span></div>`).join('')}</div>
      <button class="btn big full" data-copy-smonth>${ic('copy',20)} প্রতিবেদন কপি করুন</button>`
    : '<div class="card empty"><p class="t2" style="font-size:14px">এই মাসে এই শ্রেণির কোনো হাজিরা নেওয়া হয়নি।</p></div>'}`;
}
function setStudentStatus(id, st){
  const day = attDay('students', curDate(), true);
  if (day[id] === st) delete day[id]; else day[id] = st;
  save(); render();
}

/* reports as text, for WhatsApp etc. */
function copyText(text, okMsg){
  const done = () => toast(okMsg || 'কপি হয়েছে');
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly',''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch(_) {}
    document.body.removeChild(ta);
    if (ok) done(); else openSheet(`<h2 style="font-size:18px;margin-bottom:8px">রিপোর্ট</h2><p class="t2" style="font-size:13px;margin-bottom:8px">লেখাটি চেপে ধরে কপি করুন।</p><div class="field"><textarea rows="10" readonly>${esc(text)}</textarea></div><button class="btn big full" style="margin-top:12px" data-close>বন্ধ করুন</button>`);
  };
  try { if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback); else fallback(); } catch(_) { fallback(); }
}
function studentDayText(){
  const d = curDate(), day = attDay('students', d), list = sortedStudents(UI.attClass);
  const by = k => list.filter(s => day[s.id] === k);
  const fmt = arr => arr.map(s => (s.roll ? 'রোল ' + bn(s.roll) + ' - ' : '') + s.name).join('\n');
  const a = by('a'), l = by('l'), p = by('p');
  return `${DB.teacher.school}\nশিক্ষার্থী উপস্থিতি — ${longDate(d)}\n${CLASS_NAME[UI.attClass]}: মোট ${bn(list.length)} জন\nউপস্থিত ${bn(p.length)}, অনুপস্থিত ${bn(a.length)}, ছুটি ${bn(l.length)}` +
    (a.length ? `\n\nঅনুপস্থিত:\n${fmt(a)}` : '') + (l.length ? `\n\nছুটি:\n${fmt(l)}` : '');
}
function studentMonthText(){
  const {ym, days, rows} = studentMonthData();
  return `${DB.teacher.school}\n${CLASS_NAME[UI.attClass]} — ${monthName(ym)} মাসের উপস্থিতি\nহাজিরার দিন: ${bn(days.length)}\n\n` +
    rows.map(({s,c,pct}) => `${s.roll ? 'রোল ' + bn(s.roll) + ' - ' : ''}${s.name}: উপস্থিত ${bn(c.p)}, অনুপস্থিত ${bn(c.a)}, ছুটি ${bn(c.l)}${pct === null ? '' : ' (' + bn(pct) + '%)'}`).join('\n');
}
function teacherMonthText(){
  const ym = curMonth();
  const days = Object.keys(DB.attendance.teachers).filter(d => d.startsWith(ym) && Object.keys(DB.attendance.teachers[d]).length);
  return `${DB.teacher.school}\nশিক্ষক উপস্থিতি — ${monthName(ym)}\nহাজিরার দিন: ${bn(days.length)}\n\n` +
    DB.teachers.map(t => { const c = {p:0,late:0,l:0,a:0}; days.forEach(d => { const r = DB.attendance.teachers[d][t.id]; if (r && c[r.s] !== undefined) c[r.s]++; });
      return `${t.name} (${t.designation}): উপস্থিত ${bn(c.p)}, দেরি ${bn(c.late)}, ছুটি ${bn(c.l)}, অনুপস্থিত ${bn(c.a)}`; }).join('\n');
}

    </div>
    <div class="card">
      <h2 style="font-size:16px">সব তথ্য মুছুন</h2>
      <p class="t2" style="font-size:14px;line-height:1.6">শিক্ষক, শিক্ষার্থী, হাজিরা, পাঠ পরিকল্পনা, কমিটি ও প্রোফাইলের সব তথ্য মুছে অ্যাপ শুরুর অবস্থায় ফিরবে।</p>
      <button class="btn danger big full" data-reset>${ic('trash',20)} সব তথ্য মুছুন</button>
    </div>
    <p class="hint" style="text-align:center">প্রাথমিক শিক্ষক অ্যাপ · সংস্করণ ${bn(appInfo().content || WEB_VERSION)}</p>
  </div>`;
}
function backupSheet(){
  const json = JSON.stringify(DB);
  openSheet(`<h2 style="font-size:18px;margin-bottom:8px">ব্যাকআপ</h2>
    <p class="t2" style="font-size:14px;line-height:1.6;margin-bottom:10px">নিচের লেখাটি কপি করে নিজের ইমেইল, WhatsApp বা Google Drive-এ রেখে দিন। পরে "ব্যাকআপ থেকে ফেরত আনুন"-এ বসালে সব তথ্য ফিরে আসবে।</p>
    <div class="field"><textarea id="bk" rows="6" readonly aria-label="ব্যাকআপ লেখা">${esc(json)}</textarea></div>
    <div class="row2" style="margin-top:12px"><button class="btn big" data-close>বন্ধ করুন</button><button class="btn big solid" data-copy-bk>${ic('copy',18)} কপি</button></div>`);
}
function restoreSheet(){
  openSheet(`<form class="f" id="rsForm">
    <h2 style="font-size:18px">ব্যাকআপ থেকে ফেরত আনুন</h2>
    <p class="t2" style="font-size:14px;line-height:1.6">আগে কপি করা ব্যাকআপ লেখাটি এখানে পেস্ট করুন। বর্তমান সব তথ্য এর দ্বারা বদলে যাবে।</p>
    ${field('rs','ব্যাকআপ লেখা', ta('rs','',6,'required'), true)}
    <p class="hint" id="rsErr" style="color:var(--red);display:none">লেখাটি সঠিক ব্যাকআপ নয়।</p>
    <div class="row2"><button type="button" class="btn big" data-close>বাতিল</button><button type="submit" class="btn big solid">ফেরত আনুন</button></div>
  </form>`);
  document.getElementById('rsForm').addEventListener('submit', e => {
    e.preventDefault();
    try {
      const s = JSON.parse(formData(e.target).rs);
      if (!s || !s.teacher || !s.committees || !Array.isArray(s.students)) throw 0;
      const d = DEFAULTS();
      DB = withTeachers({...d, ...s, teacher:{...d.teacher, ...s.teacher}, plans:Array.isArray(s.plans)?s.plans:[]});
      if (save()) toast('ব্যাকআপ থেকে তথ্য ফেরত এসেছে');
      closeSheet(); render();
    } catch(_) { document.getElementById('rsErr').style.display='block'; }
  });
}
function confirmSheet(title, msg, okLabel, onOk){
  openSheet(`<h2 style="font-size:18px;margin-bottom:8px">${title}</h2><p class="t2" style="font-size:14px;line-height:1.6;margin-bottom:16px">${msg}</p>
    <div class="row2"><button class="btn big" data-close>বাতিল</button><button class="btn big danger solid" id="okBtn">${okLabel}</button></div>`);
  document.getElementById('okBtn').addEventListener('click', () => { onOk(); closeSheet(); render(); });
}

/* ---------- placeholders ---------- */
function placeholder(id){
  const f = ALL[id];
  const nav = {routine:['রুটিন','clock'],reports:['রিপোর্ট','report']}[id];
  const title = f ? f[3] : nav[0], key = f ? f[1] : nav[1], color = f ? f[2] : '#1E7F4F';
  return (f ? innerHeader(title, key, color) : topHeader(title, key)) + `
  <div class="card empty">
    <span class="ib" style="background:${color};box-shadow:0 6px 14px ${color}40">${S(P[key])}</span>
    <h2 style="font-size:18px">${title}</h2>
    <p style="color:var(--mute);font-size:14px;line-height:1.6">এই অংশটি তৈরির কাজ চলছে। শীঘ্রই এখানে পূর্ণাঙ্গ সুবিধা যুক্ত হবে।</p>
    ${f ? '<button class="btn solid" data-back>হোমে ফিরে যান</button>' : ''}
  </div>`;
}

/* ---------- router ---------- */
const NAV = [['home','হোম','home'],['routine','রুটিন','clock'],['reports','রিপোর্ট','report'],['profile','প্রোফাইল','user'],['settings','সেটিংস','gear']];
const TOP = NAV.map(n => n[0]);
const ROUTE_ALIAS = {'student-profile':'students'};
function render(){
  let r = (location.hash || '#home').slice(1) || 'home';
  r = ROUTE_ALIAS[r] || r;
  if (!(TOP.includes(r) || r==='committee' || r==='students' || r==='teachers' || r==='lesson-plan' || r==='teacher-att' || r==='student-att' || ALL[r])) r = 'home';
  if (r !== UI.lastRoute) { if (r === 'teacher-att' || r === 'student-att') UI.attView = 'day'; UI.lastRoute = r; }
  const inner = !TOP.includes(r);
  $app.classList.toggle('inner', inner);
  $nav.style.display = inner ? 'none' : 'grid';
  const views = {home, profile, settings, committee, students, teachers, 'lesson-plan':lessonPlan, 'teacher-att':teacherAtt, 'student-att':studentAtt};
  $app.innerHTML = (views[r] || (() => placeholder(r)))();
  $nav.innerHTML = NAV.map(n => `<button class="${n[0]===r?'on':''}" data-go="${n[0]}" aria-label="${n[1]}" ${n[0]===r?'aria-current="page"':''}><span class="p">${ic(n[2])}</span>${n[1]}</button>`).join('');
  bindView(r);
}
function bindView(r){
  if (r === 'profile') {
    document.getElementById('profileForm').addEventListener('submit', e => {
      e.preventDefault();
      const d = formData(e.target);
      if (!d.school.trim() || !d.name.trim()) return;
      DB.teacher = {name:d.name.trim(), designation:d.designation, school:d.school.trim(), mobile:d.mobile.trim()};
      const me = DB.teachers.find(x => x.me);
      if (me) Object.assign(me, {name:DB.teacher.name, designation:DB.teacher.designation, mobile:DB.teacher.mobile});
      if (save()) toast('প্রোফাইল সংরক্ষিত হয়েছে');
      render();
    });
  }
  if (r === 'students') {
    const s = document.getElementById('stuSearch');
    s.addEventListener('input', () => {
      UI.stuQuery = s.value;
      const q = s.value.trim().toLowerCase();
      const list = DB.students.filter(x => (UI.stuClass==='all' || x.cls===UI.stuClass) && (!q || [x.name,x.roll,bn(x.roll||''),x.father,x.mother,x.phone].join(' ').toLowerCase().includes(q)));
      document.getElementById('stuList').innerHTML = stuListHtml(list);
    });
  }
}
function go(id){ if (location.hash.slice(1) === id) render(); else location.hash = id; }

/* ---------- toast & sheet ---------- */
let tt;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2400);
}
const $sheet = document.getElementById('sheet'), $sbg = document.getElementById('sbg');
let lastFocus = null;
function openSheet(html){
  lastFocus = document.activeElement;
  $sheet.innerHTML = '<div class="grab" aria-hidden="true"></div>' + html;
  $sheet.classList.add('open'); $sbg.classList.add('open');
  $sheet.scrollTop = 0;
  setTimeout(() => $sheet.focus({preventScroll:true}), 50);
}
function closeSheet(){ $sheet.classList.remove('open'); $sbg.classList.remove('open'); if (lastFocus && lastFocus.focus) try { lastFocus.focus({preventScroll:true}); } catch(_){} }
$sbg.addEventListener('click', closeSheet);

function notifSheet(){
  openSheet(`<div class="top" style="margin-bottom:8px"><h2 style="font-size:18px">নোটিফিকেশন</h2><button class="btn ghost" data-readall>সব পড়া হয়েছে</button></div>
  ${NOTIFS.map(n => `<div class="note"><span class="dot ${n.read?'read':''}"></span><span class="grow"><span class="t1" style="font-weight:${n.read?500:700};font-size:14px">${n.t}</span><span class="t2">${n.d}</span></span></div>`).join('')}
  <button class="btn solid big full" style="margin-top:12px" data-close>বন্ধ করুন</button>`);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('button,a[data-go]');
  if (!el) return;
  const ds = el.dataset;
  if (el.id === 'bell') return notifSheet();
  if ('close' in ds) return closeSheet();
  if ('readall' in ds) { NOTIFS.forEach(n => n.read = true); closeSheet(); render(); return toast('সব নোটিফিকেশন পড়া হয়েছে'); }
  if (ds.go) { window.scrollTo(0,0); return go(ds.go); }
  if ('back' in ds) { if (history.length > 1) history.back(); else go('home'); return; }
  // committee
  if (ds.ctab) { UI.committeeTab = ds.ctab; UI.showAllMembers = false; try { localStorage.setItem('committeeTab', ds.ctab); } catch(_) {} return render(); }
  if ('memberNew' in ds) return memberSheet(null);
  if (ds.member) return memberSheet(ds.member);
  if ('toggleMembers' in ds) { UI.showAllMembers = !UI.showAllMembers; return render(); }
  if (ds.memberDel) { const id = ds.memberDel; const k = UI.committeeTab;
    return confirmSheet('সদস্য মুছবেন?', 'এই সদস্যের তথ্য কমিটি থেকে মুছে যাবে।', 'মুছুন', () => { DB.committees[k] = DB.committees[k].filter(x => x.id !== id); if (save()) toast('সদস্য মুছে ফেলা হয়েছে'); }); }
  // attendance
  if (ds.attShift) { const n = parseInt(ds.attShift), nd = shiftDate(curDate(), n); if (nd <= todayISO()) { UI.attDate = nd; render(); } return; }
  if (ds.attView) { UI.attView = ds.attView; return render(); }
  if (ds.attClass) { UI.attClass = ds.attClass; return render(); }
  if (ds.tatt) return setTeacherStatus(ds.tatt, ds.st);
  if (ds.satt) return setStudentStatus(ds.satt, ds.st);
  if ('tattAll' in ds) { const d = curDate(), day = attDay('teachers', d, true); DB.teachers.forEach(t => { if (!day[t.id] || !day[t.id].s) day[t.id] = {s:'p', ...(d === todayISO() ? {in:nowHM()} : {})}; }); save(); render(); return toast('বাকি সবাই উপস্থিত'); }
  if ('sattAll' in ds) { const day = attDay('students', curDate(), true); sortedStudents(UI.attClass).forEach(s => { if (!day[s.id]) day[s.id] = 'p'; }); save(); render(); return toast('বাকি সবাই উপস্থিত'); }
  if ('copySday' in ds) return copyText(studentDayText(), 'রিপোর্ট কপি হয়েছে — WhatsApp-এ পেস্ট করুন');
  if ('copySmonth' in ds) return copyText(studentMonthText(), 'মাসিক প্রতিবেদন কপি হয়েছে');
  if ('copyTmonth' in ds) return copyText(teacherMonthText(), 'মাসিক প্রতিবেদন কপি হয়েছে');
  // teachers
  if ('teacherNew' in ds) return teacherSheet(null);
  if (ds.teacher) return teacherSheet(ds.teacher);
  if (ds.teacherDel) { const id = ds.teacherDel;
    return confirmSheet('শিক্ষককে তালিকা থেকে মুছবেন?', 'এই শিক্ষকের তথ্য তালিকা থেকে মুছে যাবে।', 'মুছুন', () => { DB.teachers = DB.teachers.filter(x => x.id !== id); if (save()) toast('তালিকা থেকে মুছে ফেলা হয়েছে'); }); }
  // students
  if ('stuBulk' in ds) return bulkSheet();
  if ('stuNew' in ds) return studentSheet(null);
  if (ds.stu) return studentSheet(ds.stu);
  if (ds.stuClass) { UI.stuClass = ds.stuClass; return render(); }
  if (ds.stuDel) { const id = ds.stuDel;
    return confirmSheet('প্রোফাইল মুছবেন?', 'এই শিক্ষার্থীর সব তথ্য স্থায়ীভাবে মুছে যাবে।', 'মুছুন', () => { DB.students = DB.students.filter(x => x.id !== id); if (save()) toast('প্রোফাইল মুছে ফেলা হয়েছে'); }); }
  // lesson plans
  if (ds.lpClass) { UI.lpClass = ds.lpClass; UI.lpSubject = null; return render(); }
  if ('lpSubject' in ds) { UI.lpSubject = ds.lpSubject || null; window.scrollTo(0,0); return render(); }
  if ('lpAddsub' in ds) return addSubjectSheet();
  if (ds.lpDelsub) { const sid = ds.lpDelsub, cls = UI.lpClass;
    return confirmSheet('বিষয় মুছবেন?', 'এই বিষয় এবং এর সব পাঠ পরিকল্পনা মুছে যাবে।', 'মুছুন', () => {
      DB.customSubjects[cls] = (DB.customSubjects[cls]||[]).filter(x => x.id !== sid);
      DB.plans = DB.plans.filter(p => !(p.cls===cls && p.subject===sid)); UI.lpSubject = null; if (save()) toast('বিষয় মুছে ফেলা হয়েছে'); }); }
  if ('planNew' in ds) return planSheet(null);
  if (ds.plan) return planSheet(ds.plan);
  if (ds.planDel) { const id = ds.planDel;
    return confirmSheet('পাঠ পরিকল্পনা মুছবেন?', 'এই পাঠ পরিকল্পনাটি স্থায়ীভাবে মুছে যাবে।', 'মুছুন', () => { DB.plans = DB.plans.filter(x => x.id !== id); if (save()) toast('পাঠ পরিকল্পনা মুছে ফেলা হয়েছে'); }); }
  // updates
  if ('updApply' in ds) { if (BR) { toast('আপডেট চালু হচ্ছে…'); BR.applyUpdate(); } return; }
  if ('updApk' in ds) { if (BR && UPD.url) BR.openUrl(UPD.url); return; }
  if ('updDismiss' in ds) { updDismissed = true; return drawUpdBar(); }
  if ('updCheck' in ds) { UPD = {state:'checking'}; const l = document.getElementById('updLine'); if (l) l.textContent = UPD_TEXT.checking; return checkUpdate(true); }
  // settings
  if ('backup' in ds) return backupSheet();
  if ('copyBk' in ds) {
    const t = document.getElementById('bk');
    const done = () => toast('ব্যাকআপ কপি হয়েছে');
    try { navigator.clipboard.writeText(t.value).then(done, () => { t.select(); document.execCommand('copy'); done(); }); }
    catch(_) { t.select(); try { document.execCommand('copy'); done(); } catch(__) { toast('লেখাটি চেপে ধরে নিজে কপি করুন'); } }
    return;
  }
  if ('restore' in ds) return restoreSheet();
  if ('reset' in ds) return confirmSheet('সব তথ্য মুছবেন?', 'শিক্ষার্থী, পাঠ পরিকল্পনা, কমিটি ও প্রোফাইলের সব তথ্য স্থায়ীভাবে মুছে যাবে। আগে ব্যাকআপ নিয়ে রাখুন।', 'সব মুছুন', () => { DB = DEFAULTS(); DB.committees = {smc:[],pta:[],slip:[]}; DB.teachersSeeded = true; DB = withTeachers(DB); if (save()) toast('সব তথ্য মুছে ফেলা হয়েছে'); });
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'attDate' && el.value) { UI.attDate = el.value > todayISO() ? todayISO() : el.value; return render(); }
  if (el.id === 'attMonth' && el.value) { UI.attMonth = el.value; return render(); }
  if (el.dataset && (el.dataset.tin || el.dataset.tout)) {
    const id = el.dataset.tin || el.dataset.tout, r = attDay('teachers', curDate(), true)[id];
    if (r) { r[el.dataset.tin ? 'in' : 'out'] = el.value; if (save()) toast('সময় সংরক্ষিত হয়েছে'); }
  }
});
window.addEventListener('hashchange', () => { closeSheet(); render(); window.scrollTo(0,0); });
render();
if (BR) setTimeout(() => checkUpdate(false), 1500);
</script>
</body>
